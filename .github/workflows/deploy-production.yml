name: Deploy Producao Tops do Job V3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Executar somente o preflight ou prosseguir com o deploy
        required: true
        type: choice
        options:
          - preflight
          - deploy
      deploy_sha:
        description: SHA completo da main autorizado para a operacao
        required: true
        type: string
      confirmation:
        description: Confirmacao literal da operacao de producao
        required: true
        type: string

concurrency:
  group: topsv3-production
  cancel-in-progress: false

jobs:
  preflight-production:
    name: Preflight do destino canonico
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Validate preflight inputs and secrets
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_SSH_IDENTITY: ${{ secrets.TOPSDOJOB_PROD_SSH_PRIVATE_KEY }}
          TOPSDOJOB_PROD_SSH_HOST_KEY: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST_KEY }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
        run: |
          set -euo pipefail
          test "${REQUESTED_MODE}" = "preflight" || test "${REQUESTED_MODE}" = "deploy"
          [[ "${DEPLOY_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "${DEPLOY_SHA}" = "${GITHUB_SHA}"
          test "${CONFIRMATION}" = "DEPLOY_PRODUCTION"
          test -n "${TOPSDOJOB_PROD_SSH_HOST}"
          test "${TOPSDOJOB_PROD_SSH_USER}" = "topsdojob"
          test "${TOPSDOJOB_PROD_SSH_PORT}" -ge 1
          test "${TOPSDOJOB_PROD_SSH_PORT}" -le 65535
          test -n "${TOPSDOJOB_PROD_SSH_IDENTITY}"
          test -n "${TOPSDOJOB_PROD_SSH_HOST_KEY}"
          [[ "${TOPSDOJOB_PROD_TARGET_SHA256}" =~ ^[a-f0-9]{64}$ ]]

      - name: Preflight configure SSH
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_SSH_IDENTITY: ${{ secrets.TOPSDOJOB_PROD_SSH_PRIVATE_KEY }}
          TOPSDOJOB_PROD_SSH_HOST_KEY: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "${TOPSDOJOB_PROD_SSH_HOST_KEY}" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,3}$ ]]; then
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${TOPSDOJOB_PROD_SSH_IDENTITY}" > "${HOME}/.ssh/topsdojob_production"
          chmod 600 "${HOME}/.ssh/topsdojob_production"
          printf '[%s]:%s %s\n' "${TOPSDOJOB_PROD_SSH_HOST}" "${TOPSDOJOB_PROD_SSH_PORT}" "${TOPSDOJOB_PROD_SSH_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -F "[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}" -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Preflight validate pinned SSH host key
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}" -o ConnectTimeout=15)
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" true </dev/null

      - name: Preflight validate canonical production target
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          actual_target_sha256="$(ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'set -eu; marker=/etc/topsdojob/target.env; test -r "${marker}"; sha256sum "${marker}" | cut -d " " -f 1' </dev/null)"
          test "${actual_target_sha256}" = "${TOPSDOJOB_PROD_TARGET_SHA256}"
          unset actual_target_sha256
          target_result="$(ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'set -eu; marker=/etc/topsdojob/target.env; grep -qx "TOPSDOJOB_TARGET=production" "${marker}"; grep -qx "TOPSDOJOB_PROJECT=topsdojob-v3" "${marker}"; test -d /opt/topsv3/production; printf "%s\n" "TARGET_VERIFIED=production"' </dev/null)"
          test "${target_result}" = "TARGET_VERIFIED=production"
          printf '%s\n' "${target_result}"

  deploy-production:
    name: Testes e deploy da producao
    timeout-minutes: 120
    needs: preflight-production
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}
          fetch-depth: 1

      - name: Validate checked out deploy SHA
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Preparar imagens dos testes PostgreSQL e operacao
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for test_image in postgres:17.10-alpine postgres:17-alpine flyway/flyway:12.10.0 eclipse-temurin:17.0.13_11-jre node:22.13.1-alpine nginx:1.27-alpine; do
            timeout --signal=TERM --kill-after=15s 180s docker pull "$test_image"
            docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$test_image"
          done

      - name: Run full backend Maven gate
        working-directory: backend
        shell: bash
        env:
          LOCALIDADES_POSTGRES17_ENABLED: "true"
          FOTO_ELEGIVEL_POSTGRES17_ENABLED: "true"
          PREVIEW_BACKFILL_POSTGRES17_ENABLED: "true"
          PUBLIC_SEARCH_POSTGRES17_ENABLED: "true"
          ANUNCIOS_RELACIONADOS_POSTGRES17_ENABLED: "true"
          ANUNCIANTE_CONCURRENCY_POSTGRES17_ENABLED: "true"
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend dependency, lint and build gates
        working-directory: frontend
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://topsdojob.com
          NEXT_PUBLIC_API_URL: https://topsdojob.com/api/public
          PUBLIC_API_TIMEOUT_MS: "5000"
          NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
          NEXT_PUBLIC_FORCE_HTTPS: "true"
          NEXT_PUBLIC_EFI_PIX_ENABLED: "true"
          SEARCH_INDEXING_MODE: public
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run test:json-ld-security
          npm run test:public-ordering
          npm run test:public-http-states
          npm run test:public-data-access
          npm run test:health-readiness
          node ../scripts/deploy/testar-health-readiness-contract.mjs
          node scripts/test-public-seo-critical.mjs
          npm run test:search-indexing
          npm run test:seo-ai
          npm run test:sharp-security
          node scripts/test-ga4-production.mjs
          npm run lint
          npm run build
          node scripts/test-search-indexing-artifact.mjs public

      - name: Validate production deployment contract
        shell: pwsh
        run: ./scripts/deploy/validar-deploy-production-local.ps1

      - name: Test production database safety gate
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/deploy/testar-gate-banco-production.sh
          bash ./scripts/deploy/testar-gate-flyway-production.sh
          bash ./scripts/deploy/testar-stdin-deploy-production.sh
          bash ./scripts/deploy/testar-backfill-previews-production.sh
          for backup_restore_run in $(seq 1 10); do
            bash ./scripts/deploy/testar-backup-validado-production.sh
          done
          echo 'BACKUP_RESTORE_RUNS=10/10'
          bash ./scripts/deploy/testar-operacao-production.sh
          bash ./scripts/deploy/testar-operacao-containers-production.sh

      - name: Validate required secrets
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_SSH_IDENTITY: ${{ secrets.TOPSDOJOB_PROD_SSH_PRIVATE_KEY }}
          TOPSDOJOB_PROD_SSH_HOST_KEY: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST_KEY }}
          TOPSDOJOB_PROD_TARGET_CONFIRMATION: ${{ inputs.confirmation }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          test -n "${TOPSDOJOB_PROD_SSH_HOST}"
          test "${TOPSDOJOB_PROD_SSH_USER}" = "topsdojob"
          test "${TOPSDOJOB_PROD_SSH_PORT}" -ge 1
          test "${TOPSDOJOB_PROD_SSH_PORT}" -le 65535
          test -n "${TOPSDOJOB_PROD_SSH_IDENTITY}"
          test -n "${TOPSDOJOB_PROD_SSH_HOST_KEY}"
          test "${TOPSDOJOB_PROD_TARGET_CONFIRMATION}" = "DEPLOY_PRODUCTION"
          [[ "${TOPSDOJOB_PROD_TARGET_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          test -n "${INDEXNOW_KEY}"
          [[ "${INDEXNOW_KEY}" =~ ^[A-Za-z0-9-]{8,128}$ ]]
          indexnow_key_file="frontend/public/${INDEXNOW_KEY}.txt"
          test -f "${indexnow_key_file}"
          test "$(tr -d '\r\n' < "${indexnow_key_file}")" = "${INDEXNOW_KEY}"

      - name: Configure SSH
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_SSH_IDENTITY: ${{ secrets.TOPSDOJOB_PROD_SSH_PRIVATE_KEY }}
          TOPSDOJOB_PROD_SSH_HOST_KEY: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "${TOPSDOJOB_PROD_SSH_HOST_KEY}" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,3}$ ]]; then
            echo "ERRO: chave publica SSH da producao invalida." >&2
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${TOPSDOJOB_PROD_SSH_IDENTITY}" > "${HOME}/.ssh/topsdojob_production"
          chmod 600 "${HOME}/.ssh/topsdojob_production"
          printf '[%s]:%s %s\n' "${TOPSDOJOB_PROD_SSH_HOST}" "${TOPSDOJOB_PROD_SSH_PORT}" "${TOPSDOJOB_PROD_SSH_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -F "[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}" -f "${HOME}/.ssh/known_hosts" >/dev/null
          ssh -V
          ssh -Q kex | grep -Fxq 'sntrup761x25519-sha512@openssh.com'

      - name: Validate pinned SSH host key
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}" -o ConnectTimeout=15)
          SSH_RETRY_BACKOFF=(2 4 8 16)
          for attempt in 1 2 3 4 5; do
            if ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" true </dev/null; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "ERRO: conexao SSH da producao indisponivel apos 5 tentativas." >&2
              exit 1
            fi
            delay="${SSH_RETRY_BACKOFF[$((attempt - 1))]}"
            echo "AVISO: tentativa SSH ${attempt} falhou; nova tentativa em ${delay}s." >&2
            sleep "${delay}"
          done

      - name: Validate canonical production target
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          actual_target_sha256="$(ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'set -eu; marker=/etc/topsdojob/target.env; test -r "${marker}"; sha256sum "${marker}" | cut -d " " -f 1' </dev/null)"
          if [ "${actual_target_sha256}" != "${TOPSDOJOB_PROD_TARGET_SHA256}" ]; then
            echo "ERRO: destino SSH nao corresponde a VPS canonica de producao." >&2
            exit 1
          fi
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'set -eu; marker=/etc/topsdojob/target.env; grep -qx "TOPSDOJOB_TARGET=production" "${marker}"; grep -qx "TOPSDOJOB_PROJECT=topsdojob-v3" "${marker}"; test -d /opt/topsv3/production' </dev/null
          echo "TARGET_VERIFIED=production"

      - name: Validate remote production prerequisites
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "topsdojob"
          test -r /opt/topsv3/secrets/production.env
          test -r /opt/topsv3/secrets/application-production.yml
          test -r /opt/topsv3/secrets/nginx-production-local.conf
          test -r /opt/topsv3/secrets/efi-webhook-allowlist.conf
          test -d /opt/topsv3/secrets/efi
          test -L /opt/topsv3/production/current
          test -w /opt/topsv3/production/incoming
          test -w /opt/topsv3/production/releases
          command -v docker >/dev/null
          docker compose version >/dev/null
          docker image inspect nginx:1.27-alpine >/dev/null
          docker inspect topsv3-production-postgres >/dev/null
          test "$(docker inspect topsv3-production-postgres --format '{{.State.Health.Status}}')" = "healthy"
          test "$(docker inspect topsv3-production-postgres --format '{{index .Config.Labels "com.docker.compose.project"}}')" = "topsv3-production"
          docker volume inspect topsv3-production-postgres-data >/dev/null
          sudo -n nginx -t >/dev/null
          REMOTE

      - name: Upload immutable release
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          SCP_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -P "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          ARCHIVE="${RUNNER_TEMP}/topsv3-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./frontend/node_modules' \
            --exclude='./frontend/.next' \
            --exclude='./backend/target' \
            --exclude='./target' \
            --exclude='./storage-local' \
            --exclude='./backups' \
            --exclude='./logs' \
            --exclude='./topsv3-auditoria-local' \
            --exclude='./logs-brutos-nao-versionar' \
            --exclude='./*.dump' \
            --exclude='**/*.dump' \
            --exclude='./*.backup' \
            --exclude='**/*.backup' \
            --exclude='./*.bak' \
            --exclude='./*.zip' \
            --exclude='./*.log' \
            --exclude='**/*.log' \
            --exclude='./.env' \
            --exclude='./*/.env' \
            --exclude='**/.env' \
            --exclude='./*.pem' \
            --exclude='**/*.pem' \
            --exclude='./*.key' \
            --exclude='**/*.key' \
            --exclude='./*.crt' \
            --exclude='**/*.crt' \
            --exclude='./*.p12' \
            --exclude='**/*.p12' \
            -czf "${ARCHIVE}" .
          tar -tzf "${ARCHIVE}" | grep -Fx './scripts/deploy/proteger-operacao-production.sh' >/dev/null
          ARCHIVE_SHA256="$(sha256sum -- "${ARCHIVE}" | cut -d ' ' -f 1)"
          [[ "${ARCHIVE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'mkdir -p /opt/topsv3/production/incoming /opt/topsv3/production/releases' </dev/null
          scp "${SCP_OPTS[@]}" "${ARCHIVE}" "${SSH_TARGET}:/opt/topsv3/production/incoming/${GITHUB_SHA}.tar.gz" </dev/null
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" bash -s -- "${GITHUB_SHA}" "${ARCHIVE_SHA256}" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]
          release_root=/opt/topsv3/production/releases
          release_dir="${release_root}/${release_sha}"
          incoming="/opt/topsv3/production/incoming/${release_sha}.tar.gz"
          temporary="${release_root}/.${release_sha}.incoming"
          archive_sha256="$2"
          [[ "${archive_sha256}" =~ ^[0-9a-f]{64}$ ]]
          test -f "${incoming}"
          test ! -L "${incoming}"
          test "$(sha256sum -- "${incoming}" | cut -d ' ' -f 1)" = "${archive_sha256}"
          if [ -e "${release_dir}" ]; then
            test -f "${release_dir}/.release-sha"
            test "$(cat "${release_dir}/.release-sha")" = "${release_sha}"
            rm -f "${incoming}"
            exit 0
          fi
          rm -rf -- "${temporary}"
          install -d -m 0750 "${temporary}"
          tar -xzf "${incoming}" -C "${temporary}"
          printf '%s\n' "${release_sha}" > "${temporary}/.release-sha"
          chmod -R a-w "${temporary}"
          mv -- "${temporary}" "${release_dir}"
          rm -f "${incoming}"
          REMOTE

      - name: Build and activate production release
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          [[ "${INDEXNOW_KEY}" =~ ^[A-Za-z0-9-]{8,128}$ ]]
          {
            cat <<'REMOTE_HEAD'
          set -Eeuo pipefail
          IFS= read -r indexnow_key <<'__INDEXNOW_VALUE__'
          REMOTE_HEAD
            printf '%s\n' "${INDEXNOW_KEY}"
            cat <<'REMOTE'
          __INDEXNOW_VALUE__
          release_sha="$1"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]
          deploy_root=/opt/topsv3/production
          release_dir="${deploy_root}/releases/${release_sha}"
          compose_file="${release_dir}/deploy/production/docker-compose.yml"
          env_file=/opt/topsv3/secrets/production.env
          source "${release_dir}/scripts/deploy/proteger-operacao-production.sh"
          op_begin "${deploy_root}" "${release_sha}"
          previous_release="$(readlink -f "${deploy_root}/current")"
          previous_sha="$(cat "${previous_release}/.release-sha")"
          postgres_id_before="$(docker inspect topsv3-production-postgres --format '{{.Id}}')"
          postgres_volume_before="$(docker inspect topsv3-production-postgres --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')"
          db="$(docker inspect topsv3-production-postgres --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_DB=//p')"
          user="$(docker inspect topsv3-production-postgres --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_USER=//p')"
          snapshot_sql="${release_dir}/scripts/deploy/capturar-snapshot-gate-banco-production.sql"
          database_gate="${release_dir}/scripts/deploy/validar-gate-banco-production.sh"
          flyway_gate="${release_dir}/scripts/deploy/validar-gate-flyway-production.sh"
          backup_producer="${release_dir}/scripts/deploy/criar-backup-validado-production.sh"
          migration_dir="${release_dir}/backend/src/main/resources/db/migration"
          snapshot_dir="$(mktemp -d)"
          snapshot_before="${snapshot_dir}/before.snapshot"
          snapshot_migrated="${snapshot_dir}/migrated.snapshot"
          snapshot_after="${snapshot_dir}/after.snapshot"
          backup_receipt="${snapshot_dir}/backup.receipt"
          export TOPSV3_RELEASE_SHA="${release_sha}"
          compose=(docker compose --env-file "${env_file}" -f "${compose_file}" -p topsv3-production)

          cleanup_database_gate() {
            rm -rf -- "${snapshot_dir}"
          }

          capture_database_snapshot() {
            destination="$1"
            health_state="$2"
            docker exec -i topsv3-production-postgres psql \
              --no-psqlrc --set=ON_ERROR_STOP=1 \
              -U "${user}" -d "${db}" -At -F '|' \
              < "${snapshot_sql}" > "${destination}"
            printf 'META|health|%s\n' "${health_state}" >> "${destination}"
            LC_ALL=C sort -o "${destination}" "${destination}"
          }

          read_flyway_state() {
            expected_version="$1"
            expected_numeric="$((10#${expected_version}))"
            docker exec topsv3-production-postgres psql \
              --no-psqlrc --set=ON_ERROR_STOP=1 \
              -U "${user}" -d "${db}" -At -F '|' \
              </dev/null --command "
                SELECT
                  COALESCE((
                    SELECT version
                    FROM flyway_schema_history
                    WHERE success AND version ~ '^[0-9]+$'
                    ORDER BY version::integer DESC, installed_rank DESC
                    LIMIT 1
                  ), 'AUSENTE'),
                  count(*) FILTER (WHERE NOT success),
                  count(*) FILTER (
                    WHERE success
                      AND CASE
                        WHEN version ~ '^[0-9]+$' THEN version::integer
                        ELSE NULL
                      END = ${expected_numeric}
                  )
                FROM flyway_schema_history;
              "
          }


          "${compose[@]}" config --quiet
          op_smoke "${previous_sha}"
          baseline_health=UP
          capture_database_snapshot "${snapshot_before}" "${baseline_health}"
          expected_flyway="$(bash "${flyway_gate}" expected "${migration_dir}")"
          flyway_before_state="$(read_flyway_state "${expected_flyway}")"
          IFS='|' read -r applied_before failed_before expected_count_before <<<"${flyway_before_state}"
          inspection="$(bash "${flyway_gate}" inspect "${expected_flyway}" \
            "${applied_before}" "${failed_before}" "${expected_count_before}" NOT_CHECKED)"
          migrations_pending="$(awk -F= '$1 == "MIGRATIONS_PENDING" { print $2 }' <<< "${inspection}")"
          test "${migrations_pending}" = true || test "${migrations_pending}" = false
          bash "${database_gate}" "${snapshot_before}" "${snapshot_before}" "${applied_before}"

          # IndexNow is part of the snapshotted, supervised mutation.
          op_phase CONFIGURING
          [[ "${indexnow_key}" =~ ^[A-Za-z0-9-]{8,128}$ ]]
          test -r /opt/topsv3/secrets/production.env
          docker image inspect nginx:1.27-alpine >/dev/null
          op_expect_indexnow "${indexnow_key}"
          op_run mutating docker run --rm -i --pull never \
            --network none \
            --read-only \
            --cap-drop ALL \
            --cap-add CHOWN \
            --security-opt no-new-privileges:true \
            --volume /opt/topsv3/secrets:/secrets:rw \
            nginx:1.27-alpine sh -c '
          set -eu
          env_file=/secrets/production.env
          IFS= read -r key
          test -n "${key}"
          case "${key}" in
            *[!A-Za-z0-9-]*) exit 2 ;;
          esac
          key_length="${#key}"
          test "${key_length}" -ge 8
          test "${key_length}" -le 128
          owner="$(stat -c "%u:%g" "${env_file}")"
          mode="$(stat -c "%a" "${env_file}")"
          temporary="$(mktemp "${env_file}.indexnow.XXXXXX")"
          cleanup() { rm -f -- "${temporary}"; }
          trap cleanup EXIT
          awk "!/^INDEXNOW_KEY=/" "${env_file}" > "${temporary}"
          printf "INDEXNOW_KEY=%s\n" "${key}" >> "${temporary}"
          chmod "${mode}" "${temporary}"
          chown "${owner}" "${temporary}"
          mv -f -- "${temporary}" "${env_file}"
          trap - EXIT
          ' <<<"${indexnow_key}"
          unset indexnow_key

          backup_status=NOT_REQUIRED
          if [ "${migrations_pending}" = true ]; then
            test -f "${previous_release}/.release-sha"
            current_production_sha="$(cat "${previous_release}/.release-sha")"
            op_run mutating bash "${backup_producer}" \
              topsv3-production-postgres \
              "${deploy_root}/backups/postgresql" \
              "${current_production_sha}" \
              "${backup_receipt}"
            backup_status="$(sed -n 's/^BACKUP_STATUS=//p' "${backup_receipt}")"
            test "${backup_status}" = VALIDATED
          fi
          bash "${flyway_gate}" before "${expected_flyway}" \
            "${applied_before}" "${failed_before}" "${expected_count_before}" "${backup_status}"

          op_phase MIGRATING
          op_run mutating "${compose[@]}" run --rm -T --no-deps flyway migrate </dev/null
          op_run readonly "${compose[@]}" run --rm -T --no-deps flyway validate </dev/null
          flyway_after_state="$(read_flyway_state "${expected_flyway}")"
          IFS='|' read -r applied_after_migration failed_after_migration expected_count_after_migration <<<"${flyway_after_state}"
          bash "${flyway_gate}" after "${expected_flyway}" \
            "${applied_after_migration}" "${failed_after_migration}" \
            "${expected_count_after_migration}" "${backup_status}"
          capture_database_snapshot "${snapshot_migrated}" "${baseline_health}"
          bash "${database_gate}" "${snapshot_before}" "${snapshot_migrated}" \
            "${applied_before}" "${expected_flyway}"

          op_phase BUILDING
          op_run mutating "${compose[@]}" build backend frontend
          op_expect_candidate
          op_phase ACTIVATING
          op_run mutating "${compose[@]}" up -d --no-deps --force-recreate backend frontend gateway

          op_phase SMOKE
          op_smoke "${release_sha}"
          test "$(docker inspect topsv3-production-postgres --format '{{.Id}}')" = "${postgres_id_before}"
          test "$(docker inspect topsv3-production-postgres --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')" = "${postgres_volume_before}"
          capture_database_snapshot "${snapshot_after}" UP
          bash "${database_gate}" "${snapshot_migrated}" "${snapshot_after}" \
            "${expected_flyway}"

          op_phase PROMOTING
          current_link="${deploy_root}/.current-${release_sha}"
          rm -f "${current_link}"
          ln -s "releases/${release_sha}" "${current_link}"
          mv -Tf "${current_link}" "${deploy_root}/current"
          test "$(readlink -f "${deploy_root}/current")" = "${release_dir}"
          # The former final smoke stays inside the same ownership and failure handler.
          test "$(readlink -f /opt/topsv3/production/current)" = "${release_dir}"
          test "$(cat /opt/topsv3/production/current/.release-sha)" = "${release_sha}"
          for service in backend frontend gateway; do
            config_files="$(docker inspect "topsv3-production-${service}" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}')"
            case "${config_files}" in
              *"/releases/${release_sha}/deploy/production/docker-compose.yml"*) ;;
              *) echo "ERRO: ${service} nao usa o release ${release_sha}." >&2; exit 1 ;;
            esac
            test "$(docker inspect "topsv3-production-${service}" --format '{{index .Config.Labels "com.docker.compose.project"}}')" = "topsv3-production"
            test "$(docker inspect "topsv3-production-${service}" --format '{{.State.Running}}')" = "true"
          done
          test "$(docker inspect topsv3-production-postgres --format '{{.State.Health.Status}}')" = "healthy"
          curl -fsS http://127.0.0.1:28080/api/health/liveness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:28080/api/health/readiness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:23010/health/liveness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:23010/health/readiness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:23000/health/liveness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:23000/health/readiness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:23000/ >/dev/null
          curl -fsS http://127.0.0.1:23000/anuncios >/dev/null
          frontend_env="$(docker inspect topsv3-production-frontend --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -qx 'NEXT_PUBLIC_SITE_URL=https://topsdojob.com' <<< "${frontend_env}"
          grep -qx 'NEXT_PUBLIC_ANALYTICS_ENABLED=true' <<< "${frontend_env}"
          grep -qx 'SEARCH_INDEXING_MODE=public' <<< "${frontend_env}"
          grep -q '^INDEXNOW_KEY=' <<< "${frontend_env}"
          backend_env="$(docker inspect topsv3-production-backend --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -qx 'SPRING_PROFILES_ACTIVE=production' <<< "${backend_env}"
          grep -qx 'APP_ENV=producao' <<< "${backend_env}"
          if printf '%s\n%s\n' "${backend_env}" "${frontend_env}" | grep -Eqi 'v3\.esle\.cloud|mailpit|homologacao|sandbox'; then
            echo 'ERRO: configuracao de homologacao encontrada no runtime de producao.' >&2
            exit 1
          fi
          logs="$(docker logs topsv3-production-backend 2>&1)"
          if printf '%s' "${logs}" | grep -Eqi 'IMPORTACAO_.*(INICIO|EXECUTADA)|fixture.*(INICIO|EXECUTADA|enabled=true)'; then
            echo 'ERRO: marcador de importador ou fixture encontrado na producao.' >&2
            exit 1
          fi
          cleanup_database_gate
          op_finish
          REMOTE
          } | ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" bash -s -- "${GITHUB_SHA}"

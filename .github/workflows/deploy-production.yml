name: Deploy Producao Tops do Job V3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Executar somente o preflight ou prosseguir com o deploy
        required: true
        type: choice
        options:
          - preflight
          - deploy
      deploy_sha:
        description: SHA completo da main autorizado para a operacao
        required: true
        type: string
      confirmation:
        description: Confirmacao literal da operacao de producao
        required: true
        type: string

concurrency:
  group: topsv3-production
  cancel-in-progress: false

jobs:
  preflight-production:
    name: Preflight do destino canonico
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Validate preflight inputs and secrets
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_SSH_IDENTITY: ${{ secrets.TOPSDOJOB_PROD_SSH_PRIVATE_KEY }}
          TOPSDOJOB_PROD_SSH_HOST_KEY: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST_KEY }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
        run: |
          set -euo pipefail
          test "${REQUESTED_MODE}" = "preflight" || test "${REQUESTED_MODE}" = "deploy"
          [[ "${DEPLOY_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "${DEPLOY_SHA}" = "${GITHUB_SHA}"
          test "${CONFIRMATION}" = "DEPLOY_PRODUCTION"
          test -n "${TOPSDOJOB_PROD_SSH_HOST}"
          test "${TOPSDOJOB_PROD_SSH_USER}" = "topsdojob"
          test "${TOPSDOJOB_PROD_SSH_PORT}" -ge 1
          test "${TOPSDOJOB_PROD_SSH_PORT}" -le 65535
          test -n "${TOPSDOJOB_PROD_SSH_IDENTITY}"
          test -n "${TOPSDOJOB_PROD_SSH_HOST_KEY}"
          [[ "${TOPSDOJOB_PROD_TARGET_SHA256}" =~ ^[a-f0-9]{64}$ ]]

      - name: Preflight configure SSH
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_SSH_IDENTITY: ${{ secrets.TOPSDOJOB_PROD_SSH_PRIVATE_KEY }}
          TOPSDOJOB_PROD_SSH_HOST_KEY: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "${TOPSDOJOB_PROD_SSH_HOST_KEY}" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,3}$ ]]; then
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${TOPSDOJOB_PROD_SSH_IDENTITY}" > "${HOME}/.ssh/topsdojob_production"
          chmod 600 "${HOME}/.ssh/topsdojob_production"
          printf '[%s]:%s %s\n' "${TOPSDOJOB_PROD_SSH_HOST}" "${TOPSDOJOB_PROD_SSH_PORT}" "${TOPSDOJOB_PROD_SSH_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -F "[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}" -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Preflight validate pinned SSH host key
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}" -o ConnectTimeout=15)
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" true </dev/null

      - name: Preflight validate canonical production target
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          actual_target_sha256="$(ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'set -eu; marker=/etc/topsdojob/target.env; test -r "${marker}"; sha256sum "${marker}" | cut -d " " -f 1' </dev/null)"
          test "${actual_target_sha256}" = "${TOPSDOJOB_PROD_TARGET_SHA256}"
          unset actual_target_sha256
          target_result="$(ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'set -eu; marker=/etc/topsdojob/target.env; grep -qx "TOPSDOJOB_TARGET=production" "${marker}"; grep -qx "TOPSDOJOB_PROJECT=topsdojob-v3" "${marker}"; test -d /opt/topsv3/production; printf "%s\n" "TARGET_VERIFIED=production"' </dev/null)"
          test "${target_result}" = "TARGET_VERIFIED=production"
          printf '%s\n' "${target_result}"

  deploy-production:
    name: Testes e deploy da producao
    needs: preflight-production
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}
          fetch-depth: 1

      - name: Validate checked out deploy SHA
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run full backend Maven gate
        working-directory: backend
        shell: bash
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend dependency, lint and build gates
        working-directory: frontend
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://topsdojob.com
          NEXT_PUBLIC_API_URL: https://topsdojob.com/api/public
          PUBLIC_API_TIMEOUT_MS: "5000"
          NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
          NEXT_PUBLIC_FORCE_HTTPS: "true"
          NEXT_PUBLIC_EFI_PIX_ENABLED: "true"
          SEARCH_INDEXING_MODE: public
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run test:json-ld-security
          npm run test:public-ordering
          npm run test:public-http-states
          npm run test:public-data-access
          npm run test:health-readiness
          node ../scripts/deploy/testar-health-readiness-contract.mjs
          node scripts/test-public-seo-critical.mjs
          npm run test:search-indexing
          npm run test:seo-ai
          npm run test:sharp-security
          node scripts/test-ga4-production.mjs
          npm run lint
          npm run build

      - name: Validate production deployment contract
        shell: pwsh
        run: ./scripts/deploy/validar-deploy-production-local.ps1

      - name: Test production database safety gate
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/deploy/testar-gate-banco-production.sh
          bash ./scripts/deploy/testar-gate-flyway-production.sh
          bash ./scripts/deploy/testar-stdin-deploy-production.sh
          bash ./scripts/deploy/testar-backfill-previews-production.sh
          bash ./scripts/deploy/testar-release-atomica-production.sh
          for backup_restore_run in $(seq 1 10); do
            bash ./scripts/deploy/testar-backup-validado-production.sh
          done
          echo 'BACKUP_RESTORE_RUNS=10/10'

      - name: Validate required secrets
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_SSH_IDENTITY: ${{ secrets.TOPSDOJOB_PROD_SSH_PRIVATE_KEY }}
          TOPSDOJOB_PROD_SSH_HOST_KEY: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST_KEY }}
          TOPSDOJOB_PROD_TARGET_CONFIRMATION: ${{ inputs.confirmation }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          test -n "${TOPSDOJOB_PROD_SSH_HOST}"
          test "${TOPSDOJOB_PROD_SSH_USER}" = "topsdojob"
          test "${TOPSDOJOB_PROD_SSH_PORT}" -ge 1
          test "${TOPSDOJOB_PROD_SSH_PORT}" -le 65535
          test -n "${TOPSDOJOB_PROD_SSH_IDENTITY}"
          test -n "${TOPSDOJOB_PROD_SSH_HOST_KEY}"
          test "${TOPSDOJOB_PROD_TARGET_CONFIRMATION}" = "DEPLOY_PRODUCTION"
          [[ "${TOPSDOJOB_PROD_TARGET_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          test -n "${INDEXNOW_KEY}"
          [[ "${INDEXNOW_KEY}" =~ ^[A-Za-z0-9-]{8,128}$ ]]
          indexnow_key_file="frontend/public/${INDEXNOW_KEY}.txt"
          test -f "${indexnow_key_file}"
          test "$(tr -d '\r\n' < "${indexnow_key_file}")" = "${INDEXNOW_KEY}"

      - name: Configure SSH
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_SSH_IDENTITY: ${{ secrets.TOPSDOJOB_PROD_SSH_PRIVATE_KEY }}
          TOPSDOJOB_PROD_SSH_HOST_KEY: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "${TOPSDOJOB_PROD_SSH_HOST_KEY}" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,3}$ ]]; then
            echo "ERRO: chave publica SSH da producao invalida." >&2
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${TOPSDOJOB_PROD_SSH_IDENTITY}" > "${HOME}/.ssh/topsdojob_production"
          chmod 600 "${HOME}/.ssh/topsdojob_production"
          printf '[%s]:%s %s\n' "${TOPSDOJOB_PROD_SSH_HOST}" "${TOPSDOJOB_PROD_SSH_PORT}" "${TOPSDOJOB_PROD_SSH_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -F "[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}" -f "${HOME}/.ssh/known_hosts" >/dev/null
          ssh -V
          ssh -Q kex | grep -Fxq 'sntrup761x25519-sha512@openssh.com'

      - name: Validate pinned SSH host key
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}" -o ConnectTimeout=15)
          SSH_RETRY_BACKOFF=(2 4 8 16)
          for attempt in 1 2 3 4 5; do
            if ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" true </dev/null; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "ERRO: conexao SSH da producao indisponivel apos 5 tentativas." >&2
              exit 1
            fi
            delay="${SSH_RETRY_BACKOFF[$((attempt - 1))]}"
            echo "AVISO: tentativa SSH ${attempt} falhou; nova tentativa em ${delay}s." >&2
            sleep "${delay}"
          done

      - name: Validate canonical production target
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          actual_target_sha256="$(ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'set -eu; marker=/etc/topsdojob/target.env; test -r "${marker}"; sha256sum "${marker}" | cut -d " " -f 1' </dev/null)"
          if [ "${actual_target_sha256}" != "${TOPSDOJOB_PROD_TARGET_SHA256}" ]; then
            echo "ERRO: destino SSH nao corresponde a VPS canonica de producao." >&2
            exit 1
          fi
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" 'set -eu; marker=/etc/topsdojob/target.env; grep -qx "TOPSDOJOB_TARGET=production" "${marker}"; grep -qx "TOPSDOJOB_PROJECT=topsdojob-v3" "${marker}"; test -d /opt/topsv3/production' </dev/null
          echo "TARGET_VERIFIED=production"

      - name: Upload verified remote deploy controller
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[0-9]+$ ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          SCP_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -P "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          REMOTE_DEPLOY_SOURCE=./scripts/deploy/executar-deploy-remoto-production.sh
          REMOTE_DEPLOY_SCRIPT="/opt/topsv3/production/incoming/deploy-remoto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.sh"
          REMOTE_DEPLOY_SHA256="$(sha256sum -- "${REMOTE_DEPLOY_SOURCE}" | cut -d ' ' -f 1)"
          [[ "${REMOTE_DEPLOY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" \
            'install -d -m 0750 /opt/topsv3/production/incoming' </dev/null
          scp "${SCP_OPTS[@]}" "${REMOTE_DEPLOY_SOURCE}" "${SSH_TARGET}:${REMOTE_DEPLOY_SCRIPT}"
          remote_command="set -euo pipefail; script='${REMOTE_DEPLOY_SCRIPT}'; expected='${REMOTE_DEPLOY_SHA256}'; test -f \"\${script}\"; actual=\$(sha256sum -- \"\${script}\" | cut -d ' ' -f 1); test \"\${actual}\" = \"\${expected}\"; chmod 0500 \"\${script}\""
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "${remote_command}" </dev/null
          echo "REMOTE_DEPLOY_SCRIPT_SHA256=${REMOTE_DEPLOY_SHA256}"

      - name: Validate remote production prerequisites
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_DEPLOY_SOURCE=./scripts/deploy/executar-deploy-remoto-production.sh
          REMOTE_DEPLOY_SCRIPT="/opt/topsv3/production/incoming/deploy-remoto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.sh"
          REMOTE_DEPLOY_SHA256="$(sha256sum -- "${REMOTE_DEPLOY_SOURCE}" | cut -d ' ' -f 1)"
          bash ./scripts/deploy/invocar-deploy-remoto-production.sh \
            "${REMOTE_DEPLOY_SCRIPT}" "${REMOTE_DEPLOY_SHA256}" prerequisites

      - name: Synchronize IndexNow key in production runtime
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SCP_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -P "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          [[ "${INDEXNOW_KEY}" =~ ^[A-Za-z0-9-]{8,128}$ ]]
          REMOTE_DEPLOY_SOURCE=./scripts/deploy/executar-deploy-remoto-production.sh
          REMOTE_DEPLOY_SCRIPT="/opt/topsv3/production/incoming/deploy-remoto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.sh"
          REMOTE_DEPLOY_SHA256="$(sha256sum -- "${REMOTE_DEPLOY_SOURCE}" | cut -d ' ' -f 1)"
          LOCAL_INDEXNOW_MANIFEST="${RUNNER_TEMP}/indexnow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.key"
          REMOTE_INDEXNOW_MANIFEST="/opt/topsv3/production/incoming/indexnow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.key"
          cleanup_local_manifest() { rm -f -- "${LOCAL_INDEXNOW_MANIFEST}"; }
          trap cleanup_local_manifest EXIT
          umask 077
          printf '%s\n' "${INDEXNOW_KEY}" > "${LOCAL_INDEXNOW_MANIFEST}"
          INDEXNOW_MANIFEST_SHA256="$(sha256sum -- "${LOCAL_INDEXNOW_MANIFEST}" | cut -d ' ' -f 1)"
          scp "${SCP_OPTS[@]}" "${LOCAL_INDEXNOW_MANIFEST}" "${SSH_TARGET}:${REMOTE_INDEXNOW_MANIFEST}"
          bash ./scripts/deploy/invocar-deploy-remoto-production.sh \
            "${REMOTE_DEPLOY_SCRIPT}" "${REMOTE_DEPLOY_SHA256}" \
            indexnow "${REMOTE_INDEXNOW_MANIFEST}" "${INDEXNOW_MANIFEST_SHA256}"

      - name: Upload immutable release
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SCP_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -P "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          ARCHIVE="${RUNNER_TEMP}/topsv3-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./frontend/node_modules' \
            --exclude='./frontend/.next' \
            --exclude='./backend/target' \
            --exclude='./target' \
            --exclude='./storage-local' \
            --exclude='./backups' \
            --exclude='./logs' \
            --exclude='./topsv3-auditoria-local' \
            --exclude='./logs-brutos-nao-versionar' \
            --exclude='./*.dump' \
            --exclude='**/*.dump' \
            --exclude='./*.backup' \
            --exclude='**/*.backup' \
            --exclude='./*.bak' \
            --exclude='./*.zip' \
            --exclude='./*.log' \
            --exclude='**/*.log' \
            --exclude='./.env' \
            --exclude='./*/.env' \
            --exclude='**/.env' \
            --exclude='./*.pem' \
            --exclude='**/*.pem' \
            --exclude='./*.key' \
            --exclude='**/*.key' \
            --exclude='./*.crt' \
            --exclude='**/*.crt' \
            --exclude='./*.p12' \
            --exclude='**/*.p12' \
            -czf "${ARCHIVE}" .
          scp "${SCP_OPTS[@]}" "${ARCHIVE}" "${SSH_TARGET}:/opt/topsv3/production/incoming/${GITHUB_SHA}.tar.gz"
          REMOTE_DEPLOY_SOURCE=./scripts/deploy/executar-deploy-remoto-production.sh
          REMOTE_DEPLOY_SCRIPT="/opt/topsv3/production/incoming/deploy-remoto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.sh"
          REMOTE_DEPLOY_SHA256="$(sha256sum -- "${REMOTE_DEPLOY_SOURCE}" | cut -d ' ' -f 1)"
          bash ./scripts/deploy/invocar-deploy-remoto-production.sh \
            "${REMOTE_DEPLOY_SCRIPT}" "${REMOTE_DEPLOY_SHA256}" install "${GITHUB_SHA}"

      - name: Build and activate production release
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_DEPLOY_SOURCE=./scripts/deploy/executar-deploy-remoto-production.sh
          REMOTE_DEPLOY_SCRIPT="/opt/topsv3/production/incoming/deploy-remoto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.sh"
          REMOTE_DEPLOY_SHA256="$(sha256sum -- "${REMOTE_DEPLOY_SOURCE}" | cut -d ' ' -f 1)"
          bash ./scripts/deploy/invocar-deploy-remoto-production.sh \
            "${REMOTE_DEPLOY_SCRIPT}" "${REMOTE_DEPLOY_SHA256}" deploy "${GITHUB_SHA}"

      - name: Smoke production internally without data writes
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_DEPLOY_SOURCE=./scripts/deploy/executar-deploy-remoto-production.sh
          REMOTE_DEPLOY_SCRIPT="/opt/topsv3/production/incoming/deploy-remoto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.sh"
          REMOTE_DEPLOY_SHA256="$(sha256sum -- "${REMOTE_DEPLOY_SOURCE}" | cut -d ' ' -f 1)"
          bash ./scripts/deploy/invocar-deploy-remoto-production.sh \
            "${REMOTE_DEPLOY_SCRIPT}" "${REMOTE_DEPLOY_SHA256}" smoke "${GITHUB_SHA}"

      - name: Cleanup remote deployment transport
        if: ${{ always() }}
        shell: bash
        env:
          TOPSDOJOB_PROD_SSH_HOST: ${{ secrets.TOPSDOJOB_PROD_SSH_HOST }}
          TOPSDOJOB_PROD_SSH_USER: ${{ secrets.TOPSDOJOB_PROD_SSH_USER }}
          TOPSDOJOB_PROD_SSH_PORT: ${{ secrets.TOPSDOJOB_PROD_SSH_PORT }}
          TOPSDOJOB_PROD_TARGET_SHA256: ${{ secrets.TOPSDOJOB_PROD_TARGET_SHA256 }}
        run: |
          set -euo pipefail
          test -r "${HOME}/.ssh/topsdojob_production" || exit 0
          [[ "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[0-9]+$ ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TOPSDOJOB_PROD_TARGET_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          SSH_TARGET="${TOPSDOJOB_PROD_SSH_USER}@${TOPSDOJOB_PROD_SSH_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsdojob_production" -p "${TOPSDOJOB_PROD_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o HostKeyAlias="[${TOPSDOJOB_PROD_SSH_HOST}]:${TOPSDOJOB_PROD_SSH_PORT}")
          REMOTE_DEPLOY_SCRIPT="/opt/topsv3/production/incoming/deploy-remoto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.sh"
          REMOTE_INDEXNOW_MANIFEST="/opt/topsv3/production/incoming/indexnow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.key"
          REMOTE_ARCHIVE="/opt/topsv3/production/incoming/${GITHUB_SHA}.tar.gz"
          remote_command="set -euo pipefail; marker=/etc/topsdojob/target.env; test -r \"\${marker}\"; actual=\$(sha256sum -- \"\${marker}\" | cut -d ' ' -f 1); test \"\${actual}\" = '${TOPSDOJOB_PROD_TARGET_SHA256}'; grep -qx 'TOPSDOJOB_TARGET=production' \"\${marker}\"; grep -qx 'TOPSDOJOB_PROJECT=topsdojob-v3' \"\${marker}\"; rm -f -- '${REMOTE_DEPLOY_SCRIPT}' '${REMOTE_INDEXNOW_MANIFEST}' '${REMOTE_ARCHIVE}'"
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "${remote_command}" </dev/null

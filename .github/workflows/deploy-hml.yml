name: Deploy HML Tops do Job V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: topsv3-hml
  cancel-in-progress: false

jobs:
  deploy-hml:
    name: Deploy homologacao v3.esle.cloud
    runs-on: ubuntu-latest
    environment: hml
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17 for backend gate
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run full backend Maven gate
        working-directory: backend
        shell: bash
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Validate required secrets
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_USER: ${{ secrets.HML_USER }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
          HML_SSH_PRIVATE_KEY: ${{ secrets.HML_SSH_PRIVATE_KEY }}
          HML_DOMAIN: ${{ secrets.HML_DOMAIN }}
          HML_DEPLOY_PATH: ${{ secrets.HML_DEPLOY_PATH }}
          HML_AUTH_SMOKE_ENABLED: ${{ secrets.HML_AUTH_SMOKE_ENABLED }}
          HML_AUTH_SMOKE_RUNTIME_VALUE: ${{ secrets.HML_AUTH_SMOKE_RUNTIME_VALUE }}
        run: |
          set -euo pipefail
          test -n "${HML_HOST}"
          test -n "${HML_USER}"
          test -n "${HML_SSH_PORT}"
          test -n "${HML_SSH_PRIVATE_KEY}"
          test -n "${HML_DOMAIN}"
          test -n "${HML_DEPLOY_PATH}"
          test "${HML_AUTH_SMOKE_ENABLED}" = "true"
          test "${#HML_AUTH_SMOKE_RUNTIME_VALUE}" -ge 16
          test "${HML_USER}" = "topsv3"
          test "${HML_DOMAIN}" = "v3.esle.cloud"
          test "${HML_DEPLOY_PATH}" = "/opt/topsv3/app/current"

      - name: Configure SSH
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
          HML_SSH_PRIVATE_KEY: ${{ secrets.HML_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${HML_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/topsv3_hml"
          chmod 600 "${HOME}/.ssh/topsv3_hml"
          known_hosts_scan="$(mktemp)"
          trap 'rm -f "${known_hosts_scan}"' EXIT
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${HML_SSH_PORT}" "${HML_HOST}" > "${known_hosts_scan}" 2>/dev/null \
              && test -s "${known_hosts_scan}"; then
              cat "${known_hosts_scan}" >> "${HOME}/.ssh/known_hosts"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "ERRO: ssh-keyscan nao obteve a chave do host HML apos 3 tentativas." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Validate remote HML prerequisites
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_USER: ${{ secrets.HML_USER }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
          HML_DEPLOY_PATH: ${{ secrets.HML_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH_TARGET="${HML_USER}@${HML_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsv3_hml" -p "${HML_SSH_PORT}" -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "set -euo pipefail
            test '${HML_DEPLOY_PATH}' = '/opt/topsv3/app/current'
            test -f /opt/topsv3/secrets/hml.env
            command -v docker >/dev/null
            docker compose version >/dev/null
            sudo -n nginx -t >/dev/null
          "

      - name: Upload source without sensitive/generated files
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_USER: ${{ secrets.HML_USER }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
          HML_DEPLOY_PATH: ${{ secrets.HML_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH_TARGET="${HML_USER}@${HML_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsv3_hml" -p "${HML_SSH_PORT}" -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "set -euo pipefail
            test '${HML_DEPLOY_PATH}' = '/opt/topsv3/app/current'
            mkdir -p '${HML_DEPLOY_PATH}'
            find '${HML_DEPLOY_PATH}' -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          "
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./frontend/node_modules' \
            --exclude='./frontend/.next' \
            --exclude='./backend/target' \
            --exclude='./target' \
            --exclude='./storage-local' \
            --exclude='./backups' \
            --exclude='./logs' \
            --exclude='./topsv3-auditoria-local' \
            --exclude='./topsv3-auditoria-local/**' \
            --exclude='./logs-brutos-nao-versionar' \
            --exclude='./logs-brutos-nao-versionar/**' \
            --exclude='./*.dump' \
            --exclude='**/*.dump' \
            --exclude='./*.backup' \
            --exclude='**/*.backup' \
            --exclude='./*.bak' \
            --exclude='./*.zip' \
            --exclude='./*.log' \
            --exclude='**/*.log' \
            --exclude='./.env' \
            --exclude='./*/.env' \
            --exclude='**/.env' \
            --exclude='./*.pem' \
            --exclude='**/*.pem' \
            --exclude='./*.key' \
            --exclude='**/*.key' \
            --exclude='./*.crt' \
            --exclude='**/*.crt' \
            -czf - . | ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "tar -xzf - -C '${HML_DEPLOY_PATH}'"

      - name: Compose build and up
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_USER: ${{ secrets.HML_USER }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
          HML_DEPLOY_PATH: ${{ secrets.HML_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH_TARGET="${HML_USER}@${HML_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsv3_hml" -p "${HML_SSH_PORT}" -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "set -euo pipefail
            cd '${HML_DEPLOY_PATH}'
            test -f /opt/topsv3/secrets/hml.env
            docker compose --env-file /opt/topsv3/secrets/hml.env -f deploy/hml/docker-compose.yml -p topsv3-hml build
            docker compose --env-file /opt/topsv3/secrets/hml.env -f deploy/hml/docker-compose.yml -p topsv3-hml up -d
          "

      - name: Reconcile synthetic public Auth fixture twice
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_USER: ${{ secrets.HML_USER }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
          HML_DEPLOY_PATH: ${{ secrets.HML_DEPLOY_PATH }}
          HML_AUTH_SMOKE_ENABLED: ${{ secrets.HML_AUTH_SMOKE_ENABLED }}
          HML_AUTH_SMOKE_RUNTIME_VALUE: ${{ secrets.HML_AUTH_SMOKE_RUNTIME_VALUE }}
        run: |
          set -euo pipefail
          test "${HML_AUTH_SMOKE_ENABLED}" = "true"
          SSH_TARGET="${HML_USER}@${HML_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsv3_hml" -p "${HML_SSH_PORT}" -o StrictHostKeyChecking=yes)
          reconcile_fixture() {
            printf '%s\n' "${HML_AUTH_SMOKE_RUNTIME_VALUE}" | ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "set -euo pipefail
              IFS= read -r HML_AUTH_SMOKE_RUNTIME_VALUE
              export HML_AUTH_SMOKE_RUNTIME_VALUE
              cd '${HML_DEPLOY_PATH}'
              docker compose --env-file /opt/topsv3/secrets/hml.env -f deploy/hml/docker-compose.yml -p topsv3-hml \
                run --rm -T \
                -e HML_AUTH_SMOKE_RUNTIME_VALUE \
                backend \
                --server.port=0 \
                --spring.main.web-application-type=none \
                --app.hml-auth-smoke.enabled=true
              unset HML_AUTH_SMOKE_RUNTIME_VALUE
            "
          }
          reconcile_fixture
          reconcile_fixture

      - name: Health check
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_USER: ${{ secrets.HML_USER }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_TARGET="${HML_USER}@${HML_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsv3_hml" -p "${HML_SSH_PORT}" -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "set -euo pipefail
            set -a
            . /opt/topsv3/secrets/hml.env
            set +a
            BACKEND_PORT=\"\${HML_BACKEND_PORT:-18080}\"
            FRONTEND_PORT=\"\${HML_FRONTEND_PORT:-13000}\"
            for attempt in \$(seq 1 30); do
              if curl -fsS \"http://127.0.0.1:\${BACKEND_PORT}/api/health\" >/dev/null \
                && curl -fsS \"http://127.0.0.1:\${FRONTEND_PORT}/robots.txt\" | grep -q 'Disallow: /'; then
                exit 0
              fi
              sleep 5
            done
            exit 1
          "

      - name: Install and reload Nginx config
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_USER: ${{ secrets.HML_USER }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
          HML_DEPLOY_PATH: ${{ secrets.HML_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH_TARGET="${HML_USER}@${HML_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsv3_hml" -p "${HML_SSH_PORT}" -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "set -euo pipefail
            cd '${HML_DEPLOY_PATH}'
            sudo install -m 0644 deploy/hml/nginx-v3-esle-cloud.conf /etc/nginx/sites-available/v3-esle-cloud.conf
            sudo ln -sfn /etc/nginx/sites-available/v3-esle-cloud.conf /etc/nginx/sites-enabled/v3-esle-cloud.conf
            sudo nginx -t
            sudo systemctl reload nginx
          "

      - name: Smoke synthetic public authentication
        shell: bash
        env:
          HML_AUTH_SMOKE_ENABLED: ${{ secrets.HML_AUTH_SMOKE_ENABLED }}
          HML_AUTH_SMOKE_RUNTIME_VALUE: ${{ secrets.HML_AUTH_SMOKE_RUNTIME_VALUE }}
          HML_AUTH_SMOKE_BASE_URL: https://${{ secrets.HML_DOMAIN }}
        run: bash scripts/deploy/validar-auth-publico-hml.sh

      - name: Verify Auth secret and importers are absent from HML logs
        shell: bash
        env:
          HML_HOST: ${{ secrets.HML_HOST }}
          HML_USER: ${{ secrets.HML_USER }}
          HML_SSH_PORT: ${{ secrets.HML_SSH_PORT }}
          HML_DEPLOY_PATH: ${{ secrets.HML_DEPLOY_PATH }}
          HML_AUTH_SMOKE_RUNTIME_VALUE: ${{ secrets.HML_AUTH_SMOKE_RUNTIME_VALUE }}
        run: |
          set -euo pipefail
          SSH_TARGET="${HML_USER}@${HML_HOST}"
          SSH_OPTS=(-i "${HOME}/.ssh/topsv3_hml" -p "${HML_SSH_PORT}" -o StrictHostKeyChecking=yes)
          printf '%s\n' "${HML_AUTH_SMOKE_RUNTIME_VALUE}" | ssh "${SSH_OPTS[@]}" "${SSH_TARGET}" "set -euo pipefail
            IFS= read -r HML_AUTH_SMOKE_RUNTIME_VALUE
            cd '${HML_DEPLOY_PATH}'
            logs=\"\$(docker compose --env-file /opt/topsv3/secrets/hml.env -f deploy/hml/docker-compose.yml -p topsv3-hml logs --no-color backend)\"
            if printf '%s' \"\${logs}\" | grep -Fq -- \"\${HML_AUTH_SMOKE_RUNTIME_VALUE}\"; then
              echo 'ERRO: valor Auth apareceu nos logs HML' >&2
              exit 1
            fi
            if printf '%s' \"\${logs}\" | grep -Eq 'IMPORTACAO_CREDENCIAL_(INICIO|EXECUTADA)|importar-credenciais-legadas'; then
              echo 'ERRO: marcador de importador de credenciais encontrado nos logs HML' >&2
              exit 1
            fi
            unset HML_AUTH_SMOKE_RUNTIME_VALUE logs
          "

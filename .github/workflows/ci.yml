name: CI Tops do Job V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: topsv3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend e frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run full backend Maven gate
        working-directory: backend
        shell: bash
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend dependency, lint and build gates
        working-directory: frontend
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_API_URL: https://example.invalid/api/public
          PUBLIC_API_TIMEOUT_MS: "5000"
          NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
          NEXT_PUBLIC_FORCE_HTTPS: "true"
          NEXT_PUBLIC_EFI_PIX_ENABLED: "false"
          SEARCH_INDEXING_MODE: blocked
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run test:json-ld-security
          npm run test:public-ordering
          npm run test:public-http-states
          npm run test:public-data-access
          npm run test:health-readiness
          node ../scripts/deploy/testar-health-readiness-contract.mjs
          node scripts/test-public-seo-critical.mjs
          npm run test:search-indexing
          npm run test:seo-ai
          npm run test:sharp-security
          npm run lint
          npm run build

      - name: Validate isolated infrastructure contract
        shell: pwsh
        run: ./scripts/deploy/validar-infra-vps-legadas.ps1

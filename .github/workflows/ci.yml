name: CI Tops do Job V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: topsv3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend e frontend
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare synthetic PostgreSQL and cold JVM test images
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 --version
          docker compose version
          git fetch --no-tags --depth=1 origin ed57ed45d76e8360c25375fa32320e520e8b62d9
          for test_image in postgres:17.10-alpine postgres:17-alpine flyway/flyway:12.10.0 eclipse-temurin:17.0.13_11-jre; do
            timeout --signal=TERM --kill-after=15s 180s docker pull "$test_image"
            docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$test_image"
          done

      - name: Run full backend Maven gate
        working-directory: backend
        shell: bash
        env:
          LOCALIDADES_POSTGRES17_ENABLED: "true"
          FOTO_ELEGIVEL_POSTGRES17_ENABLED: "true"
          PREVIEW_BACKFILL_POSTGRES17_ENABLED: "true"
          PREVIEW_JOB_USER_INTEGRATION_ENABLED: "true"
          PUBLIC_SEARCH_POSTGRES17_ENABLED: "true"
          ANUNCIOS_RELACIONADOS_POSTGRES17_ENABLED: "true"
          ANUNCIANTE_CONCURRENCY_POSTGRES17_ENABLED: "true"
          ADMIN_USUARIO_UPDATE_POSTGRES17_ENABLED: "true"
          ADMIN_USUARIO_EXCLUSAO_POSTGRES17_ENABLED: "true"
          WIZARD_PROGRESS_POSTGRES17_ENABLED: "true"
          COMPLIANCE_POSTGRES17_ENABLED: "true"
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Preserve backend and cold JVM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reconciliation-evidence
          path: |
            backend/target/surefire-reports
            backend/target/localidades-cold
            backend/target/preview-backfill-cleanup-*
            !backend/target/localidades-cold/**/inputs/**
          if-no-files-found: warn

      - name: Preserve real non-root preview job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-job-user-integration-evidence
          path: backend/target/preview-job-user-*/evidence/**
          if-no-files-found: error

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare isolated browser regression tools
        shell: bash
        run: |
          set -euo pipefail
          browser_tools="$RUNNER_TEMP/reconciliation-browser-tools"
          npm install --prefix "$browser_tools" --ignore-scripts --no-fund --no-audit --save-exact playwright@1.62.1
          npm audit --prefix "$browser_tools" --audit-level=high
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium
          # F02 serves its fixtures before Next, with build/server/browser in the
          # same network-none container; no production namespace or Docker socket.
          timeout --signal=TERM --kill-after=15s 180s docker pull mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
          mkdir -p "$RUNNER_TEMP/reconciliation-browser-evidence"
          printf 'TOPS_PLAYWRIGHT_MODULE=%s/node_modules/playwright\n' "$browser_tools" >> "$GITHUB_ENV"
          printf 'TOPS_UI_EVIDENCE_ROOT=%s/reconciliation-browser-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run frontend dependency, lint and build gates
        working-directory: frontend
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_API_URL: https://example.invalid/api/public
          PUBLIC_API_TIMEOUT_MS: "5000"
          NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
          NEXT_PUBLIC_FORCE_HTTPS: "true"
          NEXT_PUBLIC_EFI_PIX_ENABLED: "false"
          SEARCH_INDEXING_MODE: blocked
        run: |
          set -euo pipefail
          run_npm_audit() {
            local attempt audit_exit audit_output normalized_output output_line error_code
            local vulnerability_pattern='#[[:space:]]+npm[[:space:]]+audit[[:space:]]+report|[0-9]+[[:space:]]+(high|critical)[[:space:]]+severity[[:space:]]+vulnerabilit'
            local outage_pattern='502[[:space:]]+bad[[:space:]]+gateway|503[[:space:]]+service[[:space:]]+unavailable|504[[:space:]]+gateway[[:space:]]+timeout|audit[[:space:]]+endpoint[[:space:]]+returned[[:space:]]+an[[:space:]]+error|econnreset|etimedout|eai_again'
            local error_code_pattern='npm[[:space:]]+(error|err!)[[:space:]]+code[[:space:]]+([[:alnum:]_]+)'
            local allowed_error_code_pattern='^(e502|e503|e504|econnreset|etimedout|eai_again)$'

            for attempt in 1 2 3; do
              printf 'npm audit attempt %d/3\n' "${attempt}"
              if audit_output="$(npm audit --audit-level=high 2>&1)"; then
                audit_exit=0
              else
                audit_exit=$?
              fi
              printf '%s\n' "${audit_output}"
              normalized_output="${audit_output,,}"

              if [ "${audit_exit}" -eq 0 ]; then
                return 0
              fi

              if [[ "${normalized_output}" =~ ${vulnerability_pattern} ]]; then
                return "${audit_exit}"
              fi

              while IFS= read -r output_line; do
                if [[ "${output_line}" =~ ${error_code_pattern} ]]; then
                  error_code="${BASH_REMATCH[2]}"
                  if [[ ! "${error_code}" =~ ${allowed_error_code_pattern} ]]; then
                    return "${audit_exit}"
                  fi
                fi
              done <<< "${normalized_output}"

              if [[ ! "${normalized_output}" =~ ${outage_pattern} ]]; then
                return "${audit_exit}"
              fi

              if [ "${attempt}" -eq 3 ]; then
                printf '%s\n' \
                  '::warning::npm audit service unavailable after 3 attempts; dependency security result is inconclusive'
                return 0
              fi

              printf 'npm audit service unavailable; retrying in 15 seconds\n' >&2
              sleep 15
            done
          }

          npm ci --no-audit
          npm audit --omit=dev --audit-level=high
          run_npm_audit
          npm run test:json-ld-security
          node scripts/test-blog-v3.mjs --browser
          npm run test:public-ordering
          npm run test:public-http-states
          npm run test:public-data-access
          npm run test:health-readiness
          node scripts/test-photo-upload-validation.mjs
          node scripts/test-meus-anuncios-fase-1b.mjs
          node scripts/test-admin-anuncios-fotos-lote.mjs
          node scripts/test-admin-anuncios-moderacao-v3.mjs
          node scripts/test-restricted-media-age-seo.mjs
          node scripts/test-story-age-gate-fail-closed.mjs
          node scripts/test-story-video-audio.mjs
          node scripts/test-age-gate-storage.mjs
          node scripts/test-wizard-minha-conta-seguranca.mjs
          node scripts/test-sensitive-image-authorization.mjs
          node scripts/test-ultima-foto-encerramento.mjs
          node scripts/test-owner-photo-preview.mjs
          node ../scripts/deploy/testar-health-readiness-contract.mjs
          node scripts/test-public-seo-critical.mjs
          node scripts/test-indexnow-v3.mjs
          node scripts/test-ga4-production.mjs
          node scripts/test-public-metrics.mjs
          node scripts/test-site-content-ssr.mjs
          node scripts/test-tickets-suporte-v3.mjs
          npm run test:search-indexing
          node scripts/test-search-indexing-artifact-selftest.mjs
          npm run test:seo-ai
          npm run test:sharp-security
          npm run lint
          npx --no-install tsc --noEmit --incremental false
          npm run build
          node scripts/test-search-indexing-artifact.mjs blocked
          npm run test:public-pagination
          bash scripts/run-admin-compliance-hub-isolated.sh
          node scripts/test-visitor-document-resume.mjs
          node scripts/test-age-gate-mobile-layout.mjs --browser

      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reconciliation-evidence
          path: ${{ runner.temp }}/reconciliation-browser-evidence
          if-no-files-found: warn

      - name: Validate isolated infrastructure contract
        shell: pwsh
        run: ./scripts/deploy/validar-infra-vps-legadas.ps1

  verify-operation:
    name: Contratos operacionais sinteticos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Prepare local operation test images
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          docker compose version
          for test_image in node:22.13.1-alpine postgres:17.10-alpine flyway/flyway:12.10.0 nginx:1.27-alpine python:3.12-slim-bookworm; do
            timeout --signal=TERM --kill-after=15s 180s docker pull "$test_image"
            docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$test_image"
          done
          fixture_image_id="$(docker image inspect --format '{{.Id}}' python:3.12-slim-bookworm)"
          [[ "$fixture_image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'TOPSV3_BACKFILL_FIXTURE_IMAGE_ID=%s\n' "$fixture_image_id" >> "$GITHUB_ENV"

      - name: Test main CI reuse gate
        shell: bash
        run: python3 ./scripts/deploy/testar-ci-main-production.py

      - name: Validate composed operation contract
        shell: pwsh
        run: ./scripts/deploy/validar-deploy-production-local.ps1

      - name: Run synthetic operation safety gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reconciliation-operation-evidence"
          first_failure=0
          python3 ./scripts/deploy/testar-transicao-previews-production.py 2>&1 | tee "$RUNNER_TEMP/reconciliation-operation-evidence/testar-transicao-previews-production.log"
          for gate in testar-stdin-deploy-production testar-gate-banco-production testar-gate-flyway-production testar-backfill-previews-production testar-coordenador-transicao-previews-production testar-gate-previews-publicos-production testar-operacao-production testar-backup-validado-production testar-operacao-containers-production; do
            set +e
            bash "./scripts/deploy/$gate.sh" 2>&1 | tee "$RUNNER_TEMP/reconciliation-operation-evidence/$gate.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            printf 'GATE %s test_exit=%s evidence_exit=%s\n' "$gate" "${codes[0]}" "${codes[1]}"
            if [ "${codes[0]}" -ne 0 ] && [ "$first_failure" -eq 0 ]; then first_failure="${codes[0]}"; fi
            if [ "${codes[1]}" -ne 0 ] && [ "$first_failure" -eq 0 ]; then first_failure="${codes[1]}"; fi
          done
          exit "$first_failure"

      - name: Preserve operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operation-reconciliation-evidence
          path: ${{ runner.temp }}/reconciliation-operation-evidence
          if-no-files-found: warn

  verify-origin451:
    name: Origem 451 Spring real - recusa segura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout candidate without changing its base
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch exact historical source for isolated negative test
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 451a6cb90dd1e67c5c774a0618c984d6b73735f8
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare isolated historical Spring test images
        shell: bash
        run: |
          set -euo pipefail
          for test_image in postgres:17.10-alpine flyway/flyway:12.10.0 eclipse-temurin:17.0.13_11-jre node:22.13.1-alpine; do
            timeout --signal=TERM --kill-after=15s 180s docker pull "$test_image"
            docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$test_image"
          done

      - name: Prove real unprepared source is rejected without promotion
        shell: bash
        env:
          ORIGIN451_WORK_ROOT: ${{ runner.temp }}/origin451-spring-evidence
        run: |
          set -euo pipefail
          mkdir -p "$ORIGIN451_WORK_ROOT"
          bash ./scripts/deploy/testar-origem451-spring-production.sh 2>&1 | tee "$ORIGIN451_WORK_ROOT/test.log"

      - name: Preserve historical source rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin451-spring-rejection-evidence
          path: |
            ${{ runner.temp }}/origin451-spring-evidence
            !${{ runner.temp }}/origin451-spring-evidence/**/source/**
            !${{ runner.temp }}/origin451-spring-evidence/**/*.tar
            !${{ runner.temp }}/origin451-spring-evidence/**/*.jar
          if-no-files-found: error

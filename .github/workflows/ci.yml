name: CI Tops do Job V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: topsv3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend e frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run full backend Maven gate
        working-directory: backend
        shell: bash
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend dependency, lint and build gates
        working-directory: frontend
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_API_URL: https://example.invalid/api/public
          PUBLIC_API_TIMEOUT_MS: "5000"
          NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
          NEXT_PUBLIC_FORCE_HTTPS: "true"
          NEXT_PUBLIC_EFI_PIX_ENABLED: "false"
          SEARCH_INDEXING_MODE: blocked
        run: |
          set -euo pipefail
          run_npm_audit() {
            local attempt audit_exit audit_output normalized_output output_line error_code
            local vulnerability_pattern='#[[:space:]]+npm[[:space:]]+audit[[:space:]]+report|[0-9]+[[:space:]]+(high|critical)[[:space:]]+severity[[:space:]]+vulnerabilit'
            local outage_pattern='502[[:space:]]+bad[[:space:]]+gateway|503[[:space:]]+service[[:space:]]+unavailable|504[[:space:]]+gateway[[:space:]]+timeout|audit[[:space:]]+endpoint[[:space:]]+returned[[:space:]]+an[[:space:]]+error|econnreset|etimedout|eai_again'
            local error_code_pattern='npm[[:space:]]+(error|err!)[[:space:]]+code[[:space:]]+([[:alnum:]_]+)'
            local allowed_error_code_pattern='^(e502|e503|e504|econnreset|etimedout|eai_again)$'

            for attempt in 1 2 3; do
              printf 'npm audit attempt %d/3\n' "${attempt}"
              if audit_output="$(npm audit --audit-level=high 2>&1)"; then
                audit_exit=0
              else
                audit_exit=$?
              fi
              printf '%s\n' "${audit_output}"
              normalized_output="${audit_output,,}"

              if [ "${audit_exit}" -eq 0 ]; then
                return 0
              fi

              if [[ "${normalized_output}" =~ ${vulnerability_pattern} ]]; then
                return "${audit_exit}"
              fi

              while IFS= read -r output_line; do
                if [[ "${output_line}" =~ ${error_code_pattern} ]]; then
                  error_code="${BASH_REMATCH[2]}"
                  if [[ ! "${error_code}" =~ ${allowed_error_code_pattern} ]]; then
                    return "${audit_exit}"
                  fi
                fi
              done <<< "${normalized_output}"

              if [[ ! "${normalized_output}" =~ ${outage_pattern} ]]; then
                return "${audit_exit}"
              fi

              if [ "${attempt}" -eq 3 ]; then
                printf '%s\n' \
                  '::warning::npm audit service unavailable after 3 attempts; dependency security result is inconclusive'
                return 0
              fi

              printf 'npm audit service unavailable; retrying in 15 seconds\n' >&2
              sleep 15
            done
          }

          npm ci --no-audit
          run_npm_audit
          npm run test:json-ld-security
          npm run test:public-ordering
          npm run test:public-http-states
          npm run test:public-data-access
          npm run test:health-readiness
          node ../scripts/deploy/testar-health-readiness-contract.mjs
          node scripts/test-public-seo-critical.mjs
          npm run test:search-indexing
          node scripts/test-search-indexing-artifact-selftest.mjs
          npm run test:seo-ai
          npm run test:sharp-security
          npm run lint
          npm run build
          node scripts/test-search-indexing-artifact.mjs blocked

      - name: Validate isolated infrastructure contract
        shell: pwsh
        run: ./scripts/deploy/validar-infra-vps-legadas.ps1

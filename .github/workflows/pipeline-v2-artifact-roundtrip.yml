name: Pipeline V2 Artifact Round Trip

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pipeline-v2-artifact-roundtrip.yml
      - .github/workflows/pipeline-production-v2.yml
      - deploy/v2/images.lock.json
      - scripts/deploy/v2/artifact.sh
      - scripts/deploy/v2/contract.mjs
      - scripts/deploy/v2/controller.sh

permissions:
  actions: read
  contents: read

concurrency:
  group: topsdojob-v2-artifact-roundtrip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  artifact-contract-upload:
    name: Upload fixture contratual
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.identity.outputs.source_sha }}
      artifact-name: ${{ steps.identity.outputs.artifact_name }}
      artifact-id: ${{ steps.transport.outputs.artifact-id }}
      artifact-digest: ${{ steps.transport.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Define fixture identity
        id: identity
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[a-f0-9]{40}$ ]]
          artifact_name="topsdojob-v2-release-${source_sha}-${RUN_ID}-${RUN_ATTEMPT}"
          printf 'source_sha=%s\nartifact_name=%s\n' \
            "${source_sha}" "${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Create tiny artifact fixture
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/topsdojob-v2-artifact-contract-upload
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          ARTIFACT_NAME: ${{ steps.identity.outputs.artifact_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash ./scripts/deploy/v2/controller.sh artifact-fixture \
            "${OUTPUT_DIR}" "${SOURCE_SHA}" "${RUN_ID}" "${RUN_ATTEMPT}" \
            "${ARTIFACT_NAME}"

      - name: Upload with the production artifact contract
        id: transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/topsdojob-v2-artifact-contract-upload
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

      - name: Remove upload fixture
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/topsdojob-v2-artifact-contract-upload"
          test ! -e "${RUNNER_TEMP}/topsdojob-v2-artifact-contract-upload"

  artifact-contract-download:
    name: Download e resolver fixture contratual
    needs: artifact-contract-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.artifact-contract-upload.outputs.source-sha }}
          fetch-depth: 1

      - name: Download by certified artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.artifact-contract-upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/topsdojob-v2-artifact-contract-download
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          digest-mismatch: error

      - name: Resolve and verify the downloaded layout
        shell: bash
        env:
          DOWNLOAD_ROOT: ${{ runner.temp }}/topsdojob-v2-artifact-contract-download
          SOURCE_SHA: ${{ needs.artifact-contract-upload.outputs.source-sha }}
          ARTIFACT_ID: ${{ needs.artifact-contract-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.artifact-contract-upload.outputs.artifact-name }}
          ARTIFACT_DIGEST: sha256:${{ needs.artifact-contract-upload.outputs.artifact-digest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash ./scripts/deploy/v2/controller.sh artifact-roundtrip \
            "${DOWNLOAD_ROOT}" "${SOURCE_SHA}" "${RUN_ID}" "${ARTIFACT_ID}" \
            "${ARTIFACT_NAME}" "${ARTIFACT_DIGEST}"
          test ! -e "${DOWNLOAD_ROOT}"

      - name: Remove failed download fixture
        if: failure()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/topsdojob-v2-artifact-contract-download"
          test ! -e "${RUNNER_TEMP}/topsdojob-v2-artifact-contract-download"

            application/json:
              schema:
                $ref: "#/components/schemas/AdminMidiaDetalhe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/midias/{id}/decidir:
    post:
      summary: Decisao local de midia administrativa
      description: Restrito a ADMIN e MODERADOR com MIDIA_REVISAR. Atualiza apenas status/classificacao de midia sintetica/local e registra auditoria sanitizada. REPROVAR exige motivo valido e retorna 400 quando ausente. SOLICITAR_AJUSTE para midia permanece pendente porque nao ha status seguro no schema atual sem migration. Nao apaga arquivo, nao faz upload, nao envia e-mail real e nao retorna bucket, chave, hash ou URL privada.
      operationId: postAdminMidiaDecidir
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDecidirMidiaRequest"
      responses:
        "200":
          description: decisao de midia registrada localmente
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAcaoModeracaoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":

        descricao: { type: string, maxLength: 500 }
        quantidadeCreditos: { type: integer, minimum: 1 }
        valor: { type: number, minimum: 0 }
        ativo: { type: boolean }
        ordemExibicao: { type: integer, minimum: 0 }
    PaginacaoPublica:

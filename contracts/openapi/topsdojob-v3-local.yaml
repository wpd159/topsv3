          type:
            - string
            - "null"
          maxLength: 240
        requestIdCliente:
          type:
            - string
            - "null"
          description: Reservado para idempotencia futura. Nesta fase local nao deduplica por requestIdCliente, nao garante reprocessamento seguro e nao deve ser usado como contrato de idempotencia. A duplicidade atual de SOLICITAR_AJUSTE e bloqueada por chave local de outbox, retornando 409.
    AdminDecidirMidiaRequest:
      type: object
      description: Request local de decisao de midia. O campo motivo e obrigatorio quando decisao for REPROVAR; APROVAR pode omitir motivo. SOLICITAR_AJUSTE retorna 400 nesta fase porque midia nao possui status seguro de ajuste sem migration.

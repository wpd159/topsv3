openapi: 3.1.0
info:
  title: Tops do Job V3 Local API
  version: 0.0.1
  description: Contrato mínimo local do skeleton e da camada transversal 1C.3.
servers:
  - url: http://localhost:8080
    description: backend local
paths:
  /api/health:
    get:
      summary: Health check local do backend
      operationId: getLocalHealth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: backend local disponível
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health/readiness:
    get:
      summary: Readiness check local do backend
      operationId: getLocalReadiness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: backend local pronto para receber tráfego local
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health/liveness:
    get:
      summary: Liveness check local do backend
      operationId: getLocalLiveness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: processo local vivo
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    RequestId:
      description: Identificador opaco de correlação da requisição.
      schema:
        type: string
        example: 11111111-1111-4111-8111-111111111111
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador opaco enviado pelo cliente para correlação.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{8,128}$"
    Page:
      name: page
      in: query
      required: false
      description: Página baseada em zero.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Quantidade de itens por página, limitada por endpoint.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Ordenação no formato campo,direcao.
      schema:
        type: array
        items:
          type: string
          example: criadoEm,desc
  responses:
    InternalError:
      description: Falha inesperada sem detalhes internos.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - app
        - environment
        - efiPixMockMode
        - requestId
      properties:
        status:
          type: string
          const: UP
        app:
          type: string
          const: topsdojob-v3-backend
        environment:
          type: string
          const: local
        efiPixMockMode:
          type: boolean
          const: true
        requestId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - status
        - error
        - code
        - message
        - path
        - requestId
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 500
        error:
          type: string
          example: Internal Server Error
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
          example: Erro interno inesperado.
        path:
          type: string
          example: /api/health
        requestId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
    ApiErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - UNPROCESSABLE_ENTITY
        - INTERNAL_ERROR
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - number
        - size
        - hasNext
        - hasPrevious
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    SortItem:
      type: object
      additionalProperties: false
      required:
        - field
        - direction
      properties:
        field:
          type: string
          example: criadoEm
        direction:
          type: string
          enum:
            - asc
            - desc
    FilterItem:
      type: object
      additionalProperties: false
      required:
        - field
        - operation
        - value
      properties:
        field:
          type: string
          example: cidade
        operation:
          type: string
          example: eq
        value:
          type: string
          example: Sao Paulo

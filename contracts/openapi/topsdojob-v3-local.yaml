          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOutboxPreviewRenderizada"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/outbox/{id}/simular-processamento-local:
    post:
      summary: Simula processamento local de outbox administrativo
      description: Restrito a ADMIN e somente operacional quando app.env/APP_ENV for local. Fora de local, incluindo app.env ausente, vazio, nao_configurado ou staging, deve retornar 403 e nao alterar o outbox. Em local, simula processamento de um outbox PENDENTE, registra auditoria sanitizada e pode alterar status para PROCESSADO porque o schema atual permite esse status. PROCESSADO por simulacao local nao equivale a envio real. Nao envia e-mail, WhatsApp, SMS, webhook, SMTP, fila externa ou API externa; nao cria worker, scheduler ou retry real. requestIdCliente e reservado e nao promete idempotencia real.
      operationId: postAdminOutboxSimularProcessamentoLocal
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOutboxSimularProcessamentoRequest"
      responses:
        "200":
          description: simulacao local executada sem envio externo
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOutboxSimularProcessamentoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: proibido quando usuario nao e ADMIN ou quando app.env nao e local
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    PublicSessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessao publica emitida pelo login; cookie HttpOnly, Secure em HML e SameSite Lax.
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessao administrativa local emitida por `POST /api/admin/auth/login`; cliente deve usar credentials include e o corpo da resposta nunca retorna token ou cookie.
  headers:
    RequestId:
      description: Identificador opaco de correlação da requisição.
      schema:
        type: string
        example: 11111111-1111-4111-8111-111111111111
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave opaca para impedir repeticao da mesma operacao mutavel.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: "^[A-Za-z0-9._:-]+$"
    CurrentUserAdSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
    KycSubmissionId:
      name: envioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador opaco enviado pelo cliente para correlação.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{8,128}$"
    Page:
      name: page
      in: query
      required: false
      description: Página baseada em zero.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Quantidade de itens por página, limitada por endpoint.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Ordenação no formato campo,direcao.
      schema:
        type: array
        items:
          type: string
          example: criadoEm,desc
    Pagina:
      name: pagina
      in: query
      required: false
      description: Pagina baseada em zero para endpoints publicos.
      schema:
        type: integer
        minimum: 0
        default: 0
    Tamanho:
      name: tamanho
      in: query
      required: false
      description: Quantidade de itens por pagina publica.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    BadRequest:
      description: Parametro invalido ou rota publica proibida.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: Recurso publico nao encontrado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: Autenticacao necessaria ou credenciais invalidas.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: Usuario autenticado sem permissao suficiente.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: Estado atual impede a transicao solicitada.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    PayloadTooLarge:
      description: Arquivo acima do limite permitido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnsupportedMediaType:
      description: Formato binario ou extensao nao permitidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    BadGateway:
      description: A Efí rejeitou ou nao respondeu a operacao; nenhum credito foi gerado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ServiceUnavailable:
      description: Integracao Efí desabilitada ou configuracao segura incompleta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InternalError:
      description: Falha inesperada sem detalhes internos.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    KycDocumento:
      type: object
      additionalProperties: false
      required: [id, parte, status, mimeType, tamanhoBytes]
      properties:
        id:
          type: string
          format: uuid
        parte:
          type: string
          enum: [UNICO, FRENTE, VERSO]
        status:
          type: string
        mimeType:
          type: [string, "null"]
        tamanhoBytes:
          type: integer
          format: int64
          minimum: 0
    KycStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - nomeCivil
        - cpfPreenchido
        - cpfMascarado
        - dataNascimento
        - motivo
        - prontoParaEnviarAnuncio
        - podeReenviar
        - tamanhoMaximoBytes
        - formatosAceitos
        - documentos
      properties:
        status:
          type: string
          enum: [NAO_INICIADO, PENDENTE, EM_ANALISE, APROVADO, REJEITADO, AJUSTE_SOLICITADO]
        nomeCivil:
          type: [string, "null"]
        cpfPreenchido:
          type: boolean
        cpfMascarado:
          type: [string, "null"]
          pattern: "^\\*{3}\\.\\*{3}\\.\\*{3}-[0-9]{2}$"
        dataNascimento:
          type: [string, "null"]
          format: date
        motivo:
          type: [string, "null"]
        prontoParaEnviarAnuncio:
          type: boolean
        podeReenviar:
          type: boolean
        tamanhoMaximoBytes:
          type: integer
          format: int64
          minimum: 1
        formatosAceitos:
          type: array
          items:
            type: string
            enum: [JPG, PNG, PDF]
        documentos:
          type: array
          items:
            $ref: "#/components/schemas/KycDocumento"
    KycSubmission:
      type: object
      additionalProperties: false
      required: [modoDocumento]
      properties:
        nomeCivil:
          type: string
          minLength: 3
          maxLength: 180
        cpf:
          type: string
          pattern: "^[0-9.\\-]{11,14}$"
        dataNascimento:
          type: string
          format: date
        modoDocumento:
          type: string
          enum: [PDF, FRENTE_VERSO]
        documentoUnico:
          type: string
          format: binary
        documentoFrente:
          type: string
          format: binary
        documentoVerso:
          type: string
          format: binary
    AdminKycDocumento:
      allOf:
        - $ref: "#/components/schemas/KycDocumento"
    AdminKycEnvio:
      type: object
      additionalProperties: false
      required:
        - envioId
        - usuarioId
        - nomeCivil
        - cpfMascarado
        - dataNascimento
        - status
        - motivo
        - enviadoEm
        - revisadoEm
        - documentos
      properties:
        envioId:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        nomeCivil:
          type: string
        cpfMascarado:
          type: string
          pattern: "^\\*{3}\\.\\*{3}\\.\\*{3}-[0-9]{2}$"
        dataNascimento:
          type: string
          format: date
        status:
          type: string
          enum: [PENDENTE, EM_ANALISE, APROVADO, REJEITADO, AJUSTE_SOLICITADO]
        motivo:
          type: [string, "null"]
        enviadoEm:
          type: string
          format: date-time
        revisadoEm:
          type: [string, "null"]
          format: date-time
        documentos:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AdminKycDocumento"
    AdminKycUrlTemporaria:
      type: object
      additionalProperties: false
      required: [url, expiraEm]
      properties:
        url:
          type: string
          format: uri
          description: Credencial temporaria privada; nao deve ser persistida, registrada em log ou compartilhada.
        expiraEm:
          type: string
          format: date-time
    AdminKycDecisaoRequest:
      type: object
      additionalProperties: false
      required: [decisao]
      properties:
        decisao:
          type: string
          enum: [APROVAR, REPROVAR, SOLICITAR_AJUSTE]
        motivo:
          type: [string, "null"]
          minLength: 3
          maxLength: 240
    AdminKycDecisaoResponse:
      type: object
      additionalProperties: false
      required: [envioId, status, requestId, revisadoEm]
      properties:
        envioId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APROVADO, REJEITADO, AJUSTE_SOLICITADO]
        requestId:
          type: string
        revisadoEm:
          type: string
          format: date-time
    SolicitarAnuncioPublicoRequest:
      type: object
      additionalProperties: false
      required:
        - whatsapp
        - uf
        - cidade
        - titulo
        - descricao
        - preco
        - aceiteTermos
        - confirmacaoIdade
      properties:
        whatsapp:
          type: string
          description: Apenas WhatsApp sintetico local permitido no E2E.
          example: "+5500000000000"
        uf:
          type: string
          minLength: 2
          maxLength: 2
          example: ZZ
        cidade:
          type: string
          minLength: 3
          maxLength: 80
          example: Cidade Sintetica
        bairro:
          type: string
          minLength: 2
          maxLength: 80
          example: Bairro Sintetico
        titulo:
          type: string
          minLength: 10
          maxLength: 80
          description: Nao aceita telefone, WhatsApp, URL ou rede social.
          example: Anuncio sintetico para revisao
        descricao:
          type: string
          minLength: 20
          maxLength: 600
          example: Texto sintetico neutro para validar criacao local sem dado real.
        preco:
          type: number
          exclusiveMinimum: 0
          example: 120
        categoria:
          type: string
          default: ACOMPANHANTE
          example: ACOMPANHANTE
        aceiteTermos:
          type: boolean
          const: true
        confirmacaoIdade:
          type: boolean
          const: true
        pagamentoId:
          not: {}
          description: Campo proibido neste fluxo.
        creditoId:
          not: {}
          description: Campo proibido neste fluxo.
        storageKey:
          not: {}
          description: Campo proibido neste fluxo.
        documento:
          not: {}
          description: Campo proibido neste fluxo.
    SolicitarAnuncioPublicoResponse:
      type: object
      additionalProperties: false
      required:
        - criado
        - anuncioId
        - revisaoId
        - slugLocal
        - statusAnuncio
        - statusModeracao
        - publicado
        - revisaoCriada
        - publicacaoAutomaticaExecutada
        - uploadRealExecutado
        - pagamentoCriado
        - creditoCriado
        - premiumObrigatorio
        - emailRealEnviado
        - whatsappRealEnviado
        - mensagem
      properties:
        criado:
          type: boolean
          const: true
        anuncioId:
          type: string
          format: uuid
        revisaoId:
          type: string
          format: uuid
        slugLocal:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        statusAnuncio:
          type: string
          const: PENDENTE_REVISAO
        statusModeracao:
          type: string
          const: PENDENTE
        publicado:
          type: boolean
          const: false
        revisaoCriada:
          type: boolean
          const: true
        publicacaoAutomaticaExecutada:
          type: boolean
          const: false
        uploadRealExecutado:
          type: boolean
          const: false
        pagamentoCriado:
          type: boolean
          const: false
        creditoCriado:
          type: boolean
          const: false
        premiumObrigatorio:
          type: boolean
          const: false
        emailRealEnviado:
          type: boolean
          const: false
        whatsappRealEnviado:
          type: boolean
          const: false
        mensagem:
          type: string
    SolicitarAnuncioValidationError:
      type: object
      additionalProperties: false
      required:
        - campo
        - codigo
        - mensagem
      properties:
        campo:
          type: string
        codigo:
          type: string
          enum:
            - PAYLOAD_INVALIDO
            - CAMPO_PERIGOSO
            - CAMPO_NAO_PERMITIDO
            - CAMPO_OBRIGATORIO
            - TAMANHO_INVALIDO
            - EMAIL_NAO_SINTETICO
            - WHATSAPP_NAO_SINTETICO
            - WHATSAPP_OBRIGATORIO
            - PRECO_OBRIGATORIO
            - PRECO_INVALIDO
            - TITULO_CONTATO_OU_REDE_SOCIAL
            - TITULO_SPAM
            - ACEITE_TERMOS_OBRIGATORIO
            - CONFIRMACAO_IDADE_OBRIGATORIA
            - UF_INVALIDA
            - CATEGORIA_INVALIDA
            - LOCALIDADE_SINTETICA_NAO_ENCONTRADA
        mensagem:
          type: string
    SolicitarAnuncioValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - criado
        - mensagem
        - erros
        - publicacaoAutomaticaExecutada
        - uploadRealExecutado
        - pagamentoCriado
        - creditoCriado
        - premiumObrigatorio
        - emailRealEnviado
        - whatsappRealEnviado
      properties:
        criado:
          type: boolean
          const: false
        mensagem:
          type: string
        erros:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SolicitarAnuncioValidationError"
        publicacaoAutomaticaExecutada:
          type: boolean
          const: false
        uploadRealExecutado:
          type: boolean
          const: false
        pagamentoCriado:
          type: boolean
          const: false
        creditoCriado:
          type: boolean
          const: false
        premiumObrigatorio:
          type: boolean
          const: false
        emailRealEnviado:
          type: boolean
          const: false
        whatsappRealEnviado:
          type: boolean
          const: false
    PublicRegisterRequest:
      type: object
      additionalProperties: true
      required:
        - username
        - email
        - telefone
        - dataNascimento
        - senha
        - confirmarSenha
        - acceptedTermsOfUse
        - acceptedPrivacyPolicy
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
        telefone:
          type: string
        dataNascimento:
          type: string
          format: date
        senha:
          type: string
          format: password
          writeOnly: true
          minLength: 8
        confirmarSenha:
          type: string
          format: password
          writeOnly: true
          minLength: 8
        acceptedTermsOfUse:
          type: boolean
          const: true
        acceptedPrivacyPolicy:
          type: boolean
          const: true
        acceptedPromotionalEmails:
          type: boolean
    PublicLoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          writeOnly: true
    PublicEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    PublicCodeRequest:
      type: object
      additionalProperties: false
      required: [email, codigo]
      properties:
        email: { type: string, format: email }
        codigo: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
    PublicResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, codigo, novaSenha, confirmarSenha]
      properties:
        email: { type: string, format: email }
        codigo: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
        novaSenha:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        confirmarSenha:
          type: string
          format: password
          minLength: 8
          writeOnly: true
    PublicProfileUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - telefone
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 120
        telefone:
          type: string
          description: Telefone brasileiro ou E.164, normalizado pelo backend.
    PublicUser:
      type: object
      additionalProperties: false
      required:
        - autenticado
        - id
        - username
        - nomeCompleto
        - email
        - telefone
        - status
        - cargo
      properties:
        autenticado:
          type: boolean
          const: true
        id:
          type: string
          format: uuid
        username:
          type: string
        nomeCompleto:
          type:
            - string
            - "null"
        email:
          type: string
          format: email
        telefone:
          type:
            - string
            - "null"
        status:
          type: string
        cargo:
          type: string
          const: USUARIO
    PublicAuthStatus:
      type: object
      additionalProperties: false
      required:
        - autenticado
        - status
      properties:
        autenticado:
          type: boolean
          const: false
        status:
          type: string
          const: LOGOUT_OK
    MeuAnuncio:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - titulo
        - descricao
        - categoria
        - preco
        - whatsapp
        - locaisAtendimento
        - servicos
        - status
        - statusModeracao
        - localizacao
        - capa
        - midias
        - atualizadoEm
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        titulo:
          type: string
        descricao:
          type: string
        categoria:
          type: string
        preco:
          type: [number, "null"]
          format: double
        whatsapp:
          type: [string, "null"]
          description: Contato do proprio anuncio, disponivel somente neste contrato autenticado.
        locaisAtendimento:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [A_COMBINAR, HOTEL_MOTEL, MEU_LOCAL]
        servicos:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ANAL, ATRIZ_PORNO, FETICHES, MASSAGEM_TANTRICA, ATIVO, BDSM, JOGOS_DE_INTERPRETACAO, ORAL, ATOR_PORNO, EJACULACAO_CORPORAL, MASSAGEM_EROTICA, PASSIVO, NAMORADAS, TRIO, VIDEOCHAMADA]
        status:
          type: string
          enum: [RASCUNHO, PENDENTE_REVISAO, APROVADO, PUBLICADO, PAUSADO, REJEITADO, REMOVIDO]
        statusModeracao:
          type: string
          enum: [NAO_ENVIADO, PENDENTE, APROVADO, REJEITADO]
        localizacao:
          oneOf:
            - $ref: "#/components/schemas/MeuAnuncioLocalizacao"
            - type: "null"
        capa:
          oneOf:
            - $ref: "#/components/schemas/MeuAnuncioCapa"
            - type: "null"
        midias:
          type: array
          description: Midias vinculadas em ordem, somente para leitura. Conteudo restrito ou nao publicavel nunca recebe URL.
          items:
            $ref: "#/components/schemas/MeuAnuncioMidia"
        atualizadoEm:
          type: [string, "null"]
          format: date-time
    MeuAnuncioAtualizacaoRequest:
      type: object
      additionalProperties: false
      required: [titulo, descricao, categoria, preco, uf, cidade, bairro, locaisAtendimento, servicos, whatsapp]
      properties:
        titulo:
          type: string
          minLength: 10
          maxLength: 80
        descricao:
          type: string
          minLength: 20
          maxLength: 600
        categoria:
          type: string
          pattern: "^[A-Z0-9_]{3,40}$"
        preco:
          type: [number, "null"]
          minimum: 0.01
          maximum: 999999.99
        uf:
          type: string
          pattern: "^[A-Z]{2}$"
        cidade:
          type: string
          minLength: 2
          maxLength: 80
        bairro:
          type: [string, "null"]
          minLength: 2
          maxLength: 80
        locaisAtendimento:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [A_COMBINAR, HOTEL_MOTEL, MEU_LOCAL]
        servicos:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ANAL, ATRIZ_PORNO, FETICHES, MASSAGEM_TANTRICA, ATIVO, BDSM, JOGOS_DE_INTERPRETACAO, ORAL, ATOR_PORNO, EJACULACAO_CORPORAL, MASSAGEM_EROTICA, PASSIVO, NAMORADAS, TRIO, VIDEOCHAMADA]
        whatsapp:
          type: [string, "null"]
          pattern: "^\\+[1-9][0-9]{7,14}$"
    MeuAnuncioLocalizacao:
      type: object
      additionalProperties: false
      required: [uf, cidade, cidadeSlug, bairro, bairroSlug]
      properties:
        uf:
          type: [string, "null"]
        cidade:

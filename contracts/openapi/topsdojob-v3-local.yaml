      enum:
        - APROVAR
        - REPROVAR
        - SOLICITAR_AJUSTE
    AdminDecidirRevisaoRequest:
      type: object
      description: Request local de acao sobre revisao. O campo motivo e obrigatorio quando decisao for REPROVAR ou SOLICITAR_AJUSTE; APROVAR pode omitir motivo. APROVAR/REPROVAR finalizam a revisao. SOLICITAR_AJUSTE e intermediario, nao cria decisao final e retorna 409 se ja existir outbox pendente local de ajuste para a revisao.

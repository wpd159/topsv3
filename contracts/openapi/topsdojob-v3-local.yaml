openapi: 3.1.0
info:
  title: Tops do Job V3 Local API
  version: 0.0.1
  description: "Contrato minimo local do skeleton, camada transversal, API publica de leitura e funil local Anuncie gratis. A API segue fail-closed: endpoints nao descritos em /api/** nao devem ficar publicos por acidente."
servers:
  - url: http://localhost:8080
    description: backend local
paths:
  /api/health:
    get:
      summary: Health check local do backend
      operationId: getLocalHealth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: backend local disponível
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health/readiness:
    get:
      summary: Readiness check local do backend
      operationId: getLocalReadiness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: backend local pronto para receber tráfego local
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health/liveness:
    get:
      summary: Liveness check local do backend
      operationId: getLocalLiveness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: processo local vivo
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/auth/register:
    post:
      summary: Cadastra usuario publico
      operationId: registerPublicUser
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige o token CSRF inicializado previamente por GET /api/public/auth/me quando CSRF estiver ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRegisterRequest"
      responses:
        "201":
          description: usuario publico cadastrado com credencial protegida por hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/public/auth/login:
    post:
      summary: Inicia sessao publica
      operationId: loginPublicUser
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige o token CSRF inicializado previamente por GET /api/public/auth/me quando CSRF estiver ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLoginRequest"
      responses:
        "200":
          description: sessao publica criada com cookie HttpOnly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/public/auth/confirm:
    post:
      summary: Confirma a conta publica com codigo de uso unico
      operationId: confirmPublicAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicCodeRequest" }
      responses:
        "200": { description: conta confirmada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de tentativas excedido }
  /api/public/auth/resend-confirmation:
    post:
      summary: Solicita novo codigo de confirmacao sem enumerar e-mail
      operationId: resendPublicConfirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicEmailRequest" }
      responses:
        "200": { description: resposta generica independente da existencia da conta }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de solicitacoes excedido }
  /api/public/auth/forgot-password:
    post:
      summary: Solicita recuperacao sem enumerar e-mail
      operationId: requestPublicPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicEmailRequest" }
      responses:
        "200": { description: resposta generica independente da existencia da conta }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de solicitacoes excedido }
  /api/public/auth/validate-reset-code:
    post:
      summary: Valida codigo de recuperacao sem consumi-lo
      operationId: validatePublicResetCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicCodeRequest" }
      responses:
        "200": { description: codigo valido }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de tentativas excedido }
  /api/public/auth/reset-password:
    post:
      summary: Redefine senha, consome codigo e invalida sessoes anteriores
      operationId: resetPublicPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicResetPasswordRequest" }
      responses:
        "200": { description: senha redefinida }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de tentativas excedido }
  /api/public/auth/me:
    get:
      summary: Recupera a sessao publica e inicializa o token CSRF
      operationId: getPublicSession
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: usuario da sessao publica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Atualiza os campos editaveis do perfil publico autenticado
      operationId: updatePublicProfile
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige sessao publica e token CSRF; nesta fase permite alterar somente username e telefone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicProfileUpdateRequest"
      responses:
        "200":
          description: perfil publico atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/public/auth/logout:
    post:
      summary: Invalida a sessao publica
      operationId: logoutPublicUser
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige o token CSRF inicializado previamente por GET /api/public/auth/me quando CSRF estiver ativo.
      responses:
        "200":
          description: sessao publica invalidada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAuthStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/public/minha-conta/favoritos:
    get:
      summary: Lista os anuncios favoritos do usuario autenticado
      operationId: listCurrentUserFavorites
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: O usuario e obtido exclusivamente da sessao. A resposta omite anuncios nao publicos ou removidos e expoe somente capa publica segura.
      responses:
        "200":
          description: favoritos publicos do usuario, em ordem decrescente de inclusao
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FavoritoPublico"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/minha-conta/favoritos/{slug}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
    put:
      summary: Inclui um anuncio nos favoritos de forma idempotente
      operationId: addCurrentUserFavorite
      security:
        - PublicSessionCookie: []
      description: O usuario e obtido exclusivamente da sessao; exige CSRF quando habilitado e nao aceita identificador de usuario no payload.
      responses:
        "200":
          description: estado final favoritado, inclusive quando a relacao ja existia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritoEstado"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove um anuncio dos favoritos de forma idempotente
      operationId: removeCurrentUserFavorite
      security:
        - PublicSessionCookie: []
      description: Remove somente a relacao pertencente ao usuario da sessao; exige CSRF quando habilitado.
      responses:
        "200":
          description: estado final nao favoritado, inclusive quando a relacao ja estava ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritoEstado"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/public/minha-conta/anuncios:
    get:
      summary: Lista os anuncios do usuario publico autenticado
      operationId: listCurrentUserAds
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: O usuario e obtido exclusivamente da sessao. Retorna status reais, localizacao e capa publica segura sem entidade JPA, storage, documento, contato ou midia restrita original.
      responses:
        "200":
          description: anuncios pertencentes ao usuario autenticado; a lista vazia representa ausencia real de anuncios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeuAnuncio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/minha-conta/seguranca/senha:
    post:
      summary: Altera a senha do usuario autenticado e encerra todas as sessoes
      operationId: changeCurrentUserPassword
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinhaContaAlterarSenhaRequest"
      responses:
        "200":
          description: Senha alterada, tokens ativos consumidos e sessoes invalidadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAccountAction"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Limite de tentativas excedido }
  /api/public/minha-conta/seguranca/exclusao:
    get:
      summary: Consulta o tratamento canonico aplicavel a exclusao da propria conta
      operationId: getCurrentUserDeletionEligibility
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Elegibilidade e consequencias sanitizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsuarioExclusaoElegibilidade"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Exclui ou anonimiza irreversivelmente a propria conta
      operationId: deleteCurrentUserAccount
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinhaContaExcluirRequest"
      responses:
        "200":
          description: Conta excluida fisicamente ou anonimizada conforme os vinculos duraveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsuarioExclusaoResultado"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Limite de tentativas excedido }
  /api/public/chat/conversas:
    get:
      summary: Lista as conversas diretas do usuario autenticado
      operationId: listCurrentUserChatConversations
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Conversas ordenadas pela atividade mais recente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatConversa"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Cria ou reutiliza uma conversa direta pelo anuncio ou username
      operationId: startCurrentUserChatConversation
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatNovaConversaRequest"
      responses:
        "200":
          description: Conversa criada ou reutilizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversa"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/chat/conversas/{conversaId}/mensagens:
    parameters:
      - name: conversaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/RequestId"
    get:
      summary: Consulta o historico de uma conversa autorizada
      operationId: getCurrentUserChatConversation
      security:
        - PublicSessionCookie: []
      responses:
        "200":
          description: Conversa e mensagens em ordem cronologica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversaDetalhe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Envia uma unica mensagem idempotente
      operationId: sendCurrentUserChatMessage
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatEnviarMensagemRequest"
      responses:
        "200":
          description: Mensagem persistida ou repeticao idempotente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMensagem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          description: Limite de envio de mensagens excedido
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/chat/conversas/{conversaId}/leitura:
    post:
      summary: Marca como lidas as mensagens recebidas na conversa
      operationId: markCurrentUserChatConversationRead
      security:
        - PublicSessionCookie: []
      parameters:
        - name: conversaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Total global de mensagens ainda nao lidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatNaoLidas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/chat/nao-lidas:
    get:
      summary: Conta mensagens nao lidas do usuario autenticado
      operationId: countCurrentUserUnreadChatMessages
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Total de mensagens nao lidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatNaoLidas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/painel-anunciante/performance:
    get:
      summary: Consolida a performance dos anuncios do usuario autenticado
      operationId: getCurrentAdvertiserPerformance
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: O usuario e obtido exclusivamente da sessao. Visualizacoes usam o total canonico; cliques e beneficios vigentes sao agregados no PostgreSQL somente para anuncios proprios.
      responses:
        "200":
          description: Performance consolidada do anunciante autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PainelAnunciantePerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/painel-anunciante/recomendacoes:
    get:
      summary: Calcula recomendacoes aplicaveis aos anuncios do usuario autenticado
      operationId: getCurrentAdvertiserRecommendations
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: O usuario e obtido exclusivamente da sessao. A resposta distingue recurso habilitado, colecao legitimamente vazia e falha tecnica por status HTTP.
      responses:
        "200":
          description: Recomendacoes calculadas somente com dados dos anuncios proprios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PainelAnuncianteRecomendacoes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/minha-conta/anuncios/{slug}:
    get:
      summary: Detalha um anuncio pertencente ao usuario publico autenticado
      operationId: getCurrentUserAd
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      description: O backend resolve o usuario pela sessao e recusa acesso a anuncio pertencente a outro usuario.
      responses:
        "200":
          description: detalhe sanitizado do anuncio do usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeuAnuncio"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Atualiza os campos editaveis de um anuncio do usuario autenticado
      operationId: updateCurrentUserAd
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      description: O proprietario e resolvido exclusivamente pela sessao. Slug, datas de publicacao, proprietario, beneficios e midias nao sao alterados. A edicao remete o anuncio para a revisao vigente e preserva a URL publica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeuAnuncioAtualizacaoRequest"
      responses:
        "200":
          description: anuncio atualizado e remetido para revisao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeuAnuncio"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      summary: Remove logicamente um anuncio do usuario autenticado
      operationId: removeCurrentUserAd
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      description: O proprietario e resolvido exclusivamente pela sessao. A operacao marca o anuncio como REMOVIDO e preserva dados, midias, historico e objetos de storage.
      responses:
        "200":
          description: anuncio removido logicamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeuAnuncioCicloVida"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/minha-conta/anuncios/{slug}/pausar:
    post:
      summary: Pausa um anuncio publicado do usuario autenticado
      operationId: pauseCurrentUserAd
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      description: Aceita somente anuncio PUBLICADO com moderacao APROVADA. Nao altera publicacao, beneficios, prioridade, midias ou historico.
      responses:
        "200":
          description: anuncio pausado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeuAnuncioCicloVida"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/minha-conta/anuncios/{slug}/reativar:
    post:
      summary: Reativa um anuncio pausado do usuario autenticado
      operationId: reactivateCurrentUserAd
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      description: Aceita somente anuncio PAUSADO com moderacao APROVADA. Nao restaura beneficio expirado, nao concede prioridade e nao contorna moderacao.
      responses:

              schema:
                $ref: "#/components/schemas/AdminPaginaRevisoes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/moderacao/revisoes/{id}:
    get:
      summary: Detalhe administrativo sanitizado de revisao
      description: Restrito a ADMIN e MODERADOR. Indica somente se existe conteudo solicitado, sem retornar o conteudo.
      operationId: getAdminModeracaoRevisaoDetalhe
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: detalhe sanitizado de revisao
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRevisaoDetalhe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/moderacao/revisoes/{id}/decidir:
    post:
      summary: Decisao local de revisao administrativa
      description: Restrito a ADMIN e MODERADOR com ANUNCIO_MODERAR. APROVAR e REPROVAR sao decisoes finais, registram decisao unica por revisao e finalizam a revisao. SOLICITAR_AJUSTE e acao intermediaria local, exige motivo valido, nao finaliza a revisao e nao cria decisao final em decisao_moderacao. SOLICITAR_AJUSTE registra auditoria sanitizada e outbox local pendente MODERACAO_SOLICITAR_AJUSTE, sem envio externo; duplicidade pendente retorna 409 por chave local de outbox. REPROVAR registra outbox local pendente MODERACAO_REPROVADA. Nao envia e-mail real, nao envia WhatsApp real, nao executa hard delete e nao retorna payload de revisao.
      operationId: postAdminModeracaoRevisaoDecidir
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDecidirRevisaoRequest"
      responses:
        "200":
          description: acao de moderacao registrada localmente
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAcaoModeracaoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/outbox:
    get:
      summary: Lista outbox administrativo local read-only
      description: Restrito a ADMIN e MODERADOR com escopo de moderacao. Retorna apenas eventos locais de outbox em DTO sanitizado, com previa logica de comunicacao e flag envioExternoExecutado=false. Nao envia, reenvia, processa, marca como enviado, aciona worker, scheduler, SMTP, WhatsApp ou API externa. COMERCIAL e USUARIO nao acessam.
      operationId: getAdminOutbox
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDENTE, PROCESSANDO, PROCESSADO, ERRO, CANCELADO]
        - name: tipoEvento
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: entidadeTipo
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: criadoDe
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: criadoAte
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: outbox local listado em modo somente leitura
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOutboxPagina"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/outbox/{id}:
    get:
      summary: Detalha outbox administrativo local read-only
      description: Restrito a ADMIN e MODERADOR com escopo de moderacao. Retorna detalhe sanitizado e previa logica, sem payload bruto sensivel e sem envio externo. Nao existe POST, PUT, PATCH ou DELETE para outbox nesta fase.
      operationId: getAdminOutboxDetalhe
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: outbox local detalhado em modo somente leitura
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOutboxDetalhe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessao administrativa local emitida por `POST /api/admin/auth/login`; cliente deve usar credentials include e o corpo da resposta nunca retorna token ou cookie.
  headers:
    RequestId:
      description: Identificador opaco de correlação da requisição.
      schema:
        type: string
        example: 11111111-1111-4111-8111-111111111111
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador opaco enviado pelo cliente para correlação.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{8,128}$"
    Page:
      name: page
      in: query
      required: false
      description: Página baseada em zero.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Quantidade de itens por página, limitada por endpoint.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Ordenação no formato campo,direcao.
      schema:
        type: array
        items:
          type: string
          example: criadoEm,desc
    Pagina:
      name: pagina
      in: query
      required: false
      description: Pagina baseada em zero para endpoints publicos.
      schema:
        type: integer
        minimum: 0
        default: 0
    Tamanho:
      name: tamanho
      in: query
      required: false
      description: Quantidade de itens por pagina publica.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    BadRequest:
      description: Parametro invalido ou rota publica proibida.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: Recurso publico nao encontrado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: Autenticacao necessaria ou credenciais invalidas.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: Usuario autenticado sem permissao suficiente.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: Estado atual impede a transicao solicitada.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InternalError:
      description: Falha inesperada sem detalhes internos.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - senha
      properties:
        login:
          type: string
          description: Login/e-mail administrativo local. Nao usar credencial real.
          example: admin.local@example.invalid
        senha:
          type: string
          format: password
          writeOnly: true
          description: Credencial sintetica local; nunca retorna em resposta.
    AdminMe:
      type: object
      additionalProperties: false
      required:
        - autenticado
        - usuarioId
        - nome
        - email
        - papeis
        - permissoes
      properties:
        autenticado:
          type: boolean
          const: true
        usuarioId:
          type: string
          format: uuid
        nome:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
          description: E-mail sintetico/local reservado; nao usar dado real.
        papeis:
          type: array
          items:
            type: string
            enum:
              - ADMIN
              - MODERADOR
              - COMERCIAL
              - USUARIO
        permissoes:
          type: array
          items:
            type: string
        senha:
          not: {}
          description: Campo proibido em resposta.
        senhaHash:
          not: {}
          description: Campo proibido em resposta.
        token:
          not: {}
          description: Campo proibido em resposta.
    AdminPermission:
      type: object
      additionalProperties: false
      required:
        - codigo
        - descricao
      properties:
        codigo:
          type: string
          enum:
            - ADMIN_CONFIGURAR
            - SEGURANCA_GERENCIAR
            - ANUNCIO_LER
            - ANUNCIO_MODERAR
            - MIDIA_REVISAR
            - DOCUMENTO_REVISAR
            - COMERCIAL_GERENCIAR
            - SUPORTE_ATENDER
            - AUDITORIA_LER
            - FINANCEIRO_LER
        descricao:
          type: string
    AdminPermissions:
      type: object
      additionalProperties: false
      required:
        - permissoes
      properties:
        permissoes:
          type: array
          items:
            $ref: "#/components/schemas/AdminPermission"
    AdminAuthStatus:
      type: object
      additionalProperties: false
      required:
        - autenticado
        - status
      properties:
        autenticado:
          type: boolean
        status:
          type: string
    AdminContador:
      type: object
      additionalProperties: false
      required:
        - codigo
        - rotulo
        - total
      properties:
        codigo:
          type: string
        rotulo:
          type: string
        total:
          type: integer
          format: int64
          minimum: 0
    AdminResumoAnuncios:
      type: object
      additionalProperties: false
      required:
        - totalAtivos
        - publicados
        - pendentesRevisao
        - pausados
        - bloqueados
        - comContatoConfigurado
        - porStatus
      properties:
        totalAtivos:
          type: integer
          format: int64
          minimum: 0
        publicados:
          type: integer
          format: int64
          minimum: 0
        pendentesRevisao:
          type: integer
          format: int64
          minimum: 0
        pausados:
          type: integer
          format: int64
          minimum: 0
        bloqueados:
          type: integer
          format: int64
          minimum: 0
        comContatoConfigurado:
          type: integer
          format: int64
          minimum: 0
          description: Contagem agregada; nao retorna telefone ou WhatsApp real.
        porStatus:
          type: array
          items:
            $ref: "#/components/schemas/AdminContador"
    AdminResumoModeracao:
      type: object
      additionalProperties: false
      required:
        - revisoesAbertas
        - revisoesEmAnalise
        - anunciosPendentesModeracao
        - anunciosBloqueados
        - documentosPendentes
      properties:
        revisoesAbertas:
          type: integer
          format: int64
          minimum: 0
        revisoesEmAnalise:
          type: integer
          format: int64
          minimum: 0
        anunciosPendentesModeracao:
          type: integer
          format: int64
          minimum: 0
        anunciosBloqueados:
          type: integer
          format: int64
          minimum: 0
        documentosPendentes:
          type: integer
          format: int64
          minimum: 0
          description: Contagem agregada; nao retorna documento privado.
    AdminResumoMidias:
      type: object
      additionalProperties: false
      required:
        - arquivosTotal
        - arquivosPendentes
        - arquivosValidados
        - midiasPublicaveis
        - midiasPendentes
        - midiasBloqueadas
        - storiesPublicados
        - storiesPendentes
      properties:
        arquivosTotal:
          type: integer
          format: int64
          minimum: 0
        arquivosPendentes:
          type: integer
          format: int64
          minimum: 0
        arquivosValidados:
          type: integer
          format: int64
          minimum: 0
        midiasPublicaveis:
          type: integer
          format: int64
          minimum: 0
        midiasPendentes:
          type: integer
          format: int64
          minimum: 0
        midiasBloqueadas:
          type: integer
          format: int64
          minimum: 0
        storiesPublicados:
          type: integer
          format: int64
          minimum: 0
        storiesPendentes:
          type: integer
          format: int64
          minimum: 0
    AdminResumoMetricas:
      type: object
      additionalProperties: false
      required:
        - visualizacoesTotal
        - cliquesWhatsappTotal
        - cliquesWhatsappPermitidos
        - cliquesWhatsappBloqueados
      properties:
        visualizacoesTotal:
          type: integer
          format: int64
          minimum: 0
        cliquesWhatsappTotal:
          type: integer
          format: int64
          minimum: 0
        cliquesWhatsappPermitidos:
          type: integer
          format: int64
          minimum: 0
        cliquesWhatsappBloqueados:
          type: integer
          format: int64
          minimum: 0
    AdminStatusSistema:
      type: object
      additionalProperties: false
      required:
        - app
        - ambiente
        - local
        - efiPixMockMode
        - politicaApi
        - pendenciaCsrf
      properties:
        app:
          type: string
          const: topsdojob-v3-backend
        ambiente:
          type: string
        local:
          type: boolean
        efiPixMockMode:
          type: boolean
          description: No arquivo base defaulta false; somente o profile local pode defaultar true.
        politicaApi:
          type: string
          const: API_FAIL_CLOSED
        pendenciaCsrf:
          type: string
          const: PENDENTE_CSRF_ADMIN_PRODUCAO
    AdminVisaoGeral:
      type: object
      additionalProperties: false
      required:
        - contadores
        - anuncios
        - moderacao
        - midias
        - metricas
        - sistema
      properties:
        contadores:
          type: array
          items:
            $ref: "#/components/schemas/AdminContador"
        anuncios:
          $ref: "#/components/schemas/AdminResumoAnuncios"
        moderacao:
          anyOf:
            - $ref: "#/components/schemas/AdminResumoModeracao"
            - type: "null"
        midias:
          anyOf:
            - $ref: "#/components/schemas/AdminResumoMidias"
            - type: "null"
        metricas:
          anyOf:
            - $ref: "#/components/schemas/AdminResumoMetricas"
            - type: "null"
        sistema:
          anyOf:
            - $ref: "#/components/schemas/AdminStatusSistema"
            - type: "null"
    AdminLocalizacaoSanitizada:
      type: object
      additionalProperties: false
      properties:
        uf:
          type:
            - string
            - "null"
        cidade:
          type:
            - string
            - "null"
        bairro:
          type:
            - string
            - "null"
    AdminAnuncioListaItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slug:
          type:
            - string
            - "null"
        titulo:
          type:
            - string
            - "null"
        status:
          type:
            - string
            - "null"
        statusModeracao:
          type:
            - string
            - "null"
        classificacaoConteudo:
          $ref: "#/components/schemas/ClassificacaoConteudoPublica"
        localizacao:
          anyOf:
            - $ref: "#/components/schemas/AdminLocalizacaoSanitizada"
            - type: "null"
        criadoEm:
          type:
            - string
            - "null"
          format: date-time
        atualizadoEm:
          type:
            - string
            - "null"
          format: date-time
        publicadoEm:
          type:
            - string
            - "null"
          format: date-time
        midiasTotal:
          type:
            - integer
            - "null"
          format: int64
        revisoesTotal:
          type:
            - integer
            - "null"
          format: int64
        contatoConfigurado:
          type: boolean
          description: Indicador agregado; nao retorna telefone nem WhatsApp.
        documentoPendente:
          type: boolean
          description: Indicador agregado; nao retorna documento privado.
        comercialLimitado:
          type: boolean
    AdminAnuncioDetalhe:
      allOf:
        - $ref: "#/components/schemas/AdminAnuncioListaItem"
        - type: object
          additionalProperties: false
          properties:
            descricaoResumo:
              type:
                - string
                - "null"
              description: Texto sanitizado e mascarado; nulo para COMERCIAL.
            categoria:
              type:
                - string
                - "null"
            ultimaPublicacaoEm:
              type:

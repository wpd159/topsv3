    AdminDecisaoModeracaoAcao:
      type: string
      description: Em revisoes, APROVAR e REPROVAR sao decisoes finais. SOLICITAR_AJUSTE e acao intermediaria com auditoria e outbox canonica, sem finalizar revisao e sem gravar decisao_moderacao. Em midia, SOLICITAR_AJUSTE permanece pendente por ausencia de status seguro no schema atual.
      enum:
        - APROVAR
        - REPROVAR
        - SOLICITAR_AJUSTE
    AdminDecidirRevisaoRequest:
      type: object
      description: Request de acao sobre revisao. O campo motivo e obrigatorio quando decisao for REPROVAR ou SOLICITAR_AJUSTE; APROVAR pode omitir motivo. APROVAR/REPROVAR finalizam a revisao. SOLICITAR_AJUSTE e intermediario, nao cria decisao final e retorna 409 se ja existir outbox pendente de ajuste para a revisao.
      additionalProperties: false
      required:
        - decisao
      properties:
        decisao:
          $ref: "#/components/schemas/AdminDecisaoModeracaoAcao"
        motivo:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Obrigatorio para REPROVAR e SOLICITAR_AJUSTE. Valor vazio, nulo ou apenas espacos retorna 400. O backend sanitiza e mascara e-mail, contato e documento antes de auditoria/outbox.
        observacao:
          type:
            - string
            - "null"
          maxLength: 240
        requestIdCliente:
          type:
            - string
            - "null"
          description: Reservado para idempotencia futura. Nesta fase local nao deduplica por requestIdCliente, nao garante reprocessamento seguro e nao deve ser usado como contrato de idempotencia. A duplicidade atual de SOLICITAR_AJUSTE e bloqueada por chave local de outbox, retornando 409.

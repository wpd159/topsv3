openapi: 3.1.0
info:
  title: Tops do Job V3 Local API
  version: 0.0.1
  description: "Contrato minimo local do skeleton, camada transversal, API publica de leitura e funil local Anuncie gratis. A API segue fail-closed: endpoints nao descritos em /api/** nao devem ficar publicos por acidente."
servers:
  - url: http://localhost:8080
    description: backend local
paths:
  /api/health:
    get:
      summary: Health check local do backend
      operationId: getLocalHealth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: backend local disponível
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health/readiness:
    get:
      summary: Readiness check local do backend
      operationId: getLocalReadiness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: backend local pronto para receber tráfego local
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health/liveness:
    get:
      summary: Liveness check local do backend
      operationId: getLocalLiveness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: processo local vivo
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/auth/register:
    post:
      summary: Cadastra usuario publico
      operationId: registerPublicUser
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige o token CSRF inicializado previamente por GET /api/public/auth/me quando CSRF estiver ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRegisterRequest"
      responses:
        "201":
          description: usuario publico cadastrado com credencial protegida por hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/public/auth/login:
    post:
      summary: Inicia sessao publica
      operationId: loginPublicUser
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige o token CSRF inicializado previamente por GET /api/public/auth/me quando CSRF estiver ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLoginRequest"
      responses:
        "200":
          description: sessao publica criada com cookie HttpOnly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/public/auth/confirm:
    post:
      summary: Confirma a conta publica com codigo de uso unico
      operationId: confirmPublicAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicCodeRequest" }
      responses:
        "200": { description: conta confirmada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de tentativas excedido }
  /api/public/auth/resend-confirmation:
    post:
      summary: Solicita novo codigo de confirmacao sem enumerar e-mail
      operationId: resendPublicConfirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicEmailRequest" }
      responses:
        "200": { description: resposta generica independente da existencia da conta }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de solicitacoes excedido }
  /api/public/auth/forgot-password:
    post:
      summary: Solicita recuperacao sem enumerar e-mail
      operationId: requestPublicPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicEmailRequest" }
      responses:
        "200": { description: resposta generica independente da existencia da conta }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de solicitacoes excedido }
  /api/public/auth/validate-reset-code:
    post:
      summary: Valida codigo de recuperacao sem consumi-lo
      operationId: validatePublicResetCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicCodeRequest" }
      responses:
        "200": { description: codigo valido }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de tentativas excedido }
  /api/public/auth/reset-password:
    post:
      summary: Redefine senha, consome codigo e invalida sessoes anteriores
      operationId: resetPublicPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicResetPasswordRequest" }
      responses:
        "200": { description: senha redefinida }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: limite de tentativas excedido }
  /api/public/auth/me:
    get:
      summary: Recupera a sessao publica e inicializa o token CSRF
      operationId: getPublicSession
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: usuario da sessao publica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Atualiza os campos editaveis do perfil publico autenticado
      operationId: updatePublicProfile
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige sessao publica e token CSRF; nesta fase permite alterar somente username e telefone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicProfileUpdateRequest"
      responses:
        "200":
          description: perfil publico atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/public/auth/logout:
    post:
      summary: Invalida a sessao publica
      operationId: logoutPublicUser
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige o token CSRF inicializado previamente por GET /api/public/auth/me quando CSRF estiver ativo.
      responses:
        "200":
          description: sessao publica invalidada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAuthStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/public/minha-conta/anuncios:
    get:
      summary: Lista os anuncios do usuario publico autenticado
      operationId: listCurrentUserAds
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: O usuario e obtido exclusivamente da sessao. Retorna status reais, localizacao e capa publica segura sem entidade JPA, storage, documento, contato ou midia restrita original.
      responses:
        "200":
          description: anuncios pertencentes ao usuario autenticado; a lista vazia representa ausencia real de anuncios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeuAnuncio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/minha-conta/anuncios/{slug}:
    get:
      summary: Detalha um anuncio pertencente ao usuario publico autenticado
      operationId: getCurrentUserAd
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      description: O backend resolve o usuario pela sessao e recusa acesso a anuncio pertencente a outro usuario.
      responses:
        "200":
          description: detalhe sanitizado do anuncio do usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeuAnuncio"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Atualiza os campos editaveis de um anuncio do usuario autenticado
      operationId: updateCurrentUserAd
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      description: O proprietario e resolvido exclusivamente pela sessao. Slug, datas de publicacao, proprietario, beneficios e midias nao sao alterados. A edicao remete o anuncio para a revisao vigente e preserva a URL publica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeuAnuncioAtualizacaoRequest"
      responses:
        "200":
          description: anuncio atualizado e remetido para revisao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeuAnuncio"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/minha-conta/anuncios/{slug}/midias:
    get:
      summary: Lista as midias e os limites do anuncio do usuario autenticado
      operationId: listCurrentUserAdMedia
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      responses:
        "200":
          description: Midias do proprio anuncio, sem bucket, object key, hash ou URL publica indevida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhasMidiasResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Envia uma foto ou video para a area privada do proprio anuncio
      operationId: uploadCurrentUserAdMedia
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Midia privada criada como pendente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhasMidiasResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/public/minha-conta/anuncios/{slug}/midias/limites:
    get:
      summary: Consulta os limites canonicos de midia do proprio anuncio
      operationId: getCurrentUserAdMediaLimits
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      responses:
        "200":
          description: Limites calculados pelo backend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhasMidiasLimites"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/public/minha-conta/anuncios/{slug}/midias/ordem:
    patch:
      summary: Reordena as midias ativas do proprio anuncio
      operationId: reorderCurrentUserAdMedia
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReordenarMinhasMidiasRequest"
      responses:
        "200":
          description: Ordem atualizada sem alterar classificacao ou moderacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhasMidiasResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/public/minha-conta/anuncios/{slug}/midias/{midiaId}:
    delete:
      summary: Remove logicamente uma midia do proprio anuncio
      operationId: removeCurrentUserAdMedia
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CurrentUserAdSlug"
        - name: midiaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vinculo removido logicamente; objeto fisico preservado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhasMidiasResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/public/minha-conta/kyc:
    get:
      summary: Consulta o estado documental do usuario autenticado
      operationId: getCurrentUserKyc
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Retorna somente dados privados estritamente necessarios ao proprio usuario. Nunca retorna CPF integral, bucket, object key, URL privada ou documento.
      responses:
        "200":
          description: Estado KYC do usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Envia os dados e documentos privados do KYC
      operationId: submitCurrentUserKyc
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      description: Exige CSRF. Aceita um PDF unico ou frente obrigatoria e verso opcional em JPG/PNG; grava somente no storage privado de documentos.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KycSubmission"
      responses:
        "200":
          description: Envio documental registrado como pendente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/public/usuarios/verificar-duplicidade:
    get:
      summary: Verifica duplicidade no cadastro publico
      operationId: checkPublicUserDuplicate
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: telefone
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: resultado individual de duplicidade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDuplicateCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/public/anunciar:
    post:
      summary: Cria anuncio do usuario autenticado para revisao
      description: Resolve o proprietario exclusivamente pela sessao publica e exige KYC enviado ou aprovado. Cria anuncio nao publico e revisao aberta; nao publica automaticamente nem cria pagamento, credito ou Premium.
      operationId: postPublicAnunciar
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitarAnuncioPublicoRequest"
      responses:
        "201":
          description: solicitacao local criada para revisao
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitarAnuncioPublicoResponse"
        "400":
          description: validacao do funil local recusada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitarAnuncioValidationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/anuncios/{slug}:
    get:
      summary: Detalhe publico minimo de anuncio por slug
      operationId: getPublicAnuncioBySlug
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      responses:
        "200":
          description: anuncio publico encontrado
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnuncioDetalhePublico"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/anuncios/{slug}/visualizacao:
    post:
      summary: Registra visualizacao publica local de anuncio
      description: Registra somente hashes tecnicos; nao armazena IP, User-Agent ou referer brutos. A visualizacao do anuncio nao depende da autorizacao de suas midias restritas.
      operationId: postPublicAnuncioVisualizacao
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricaPublicaRequest"
      responses:
        "200":
          description: visualizacao registrada localmente
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrarVisualizacaoPublicaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/anuncios/{slug}/clique-whatsapp:
    post:
      summary: Registra clique WhatsApp publico local
      description: Retorna whatsappUrl somente quando a politica backend autoriza anuncio PUBLICADO, APROVADO, nao removido e com contato valido. O contato nao depende de confirmacao de idade nem da visibilidade das midias.
      operationId: postPublicAnuncioCliqueWhatsapp
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricaPublicaRequest"
      responses:
        "200":
          description: clique registrado e politica de contato avaliada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliqueWhatsappPublicoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/stories/ativos:
    get:
      summary: Compoe o feed publico unico de Stories
      description: Retorna primeiro a projecao ADMINISTRATIVO ativa e depois os Stories USUARIO vigentes. A deduplicacao usa a identidade canonica do arquivo e preserva o Story pago. Nenhuma URL e entregue antes da confirmacao etaria.
      operationId: getPublicStoriesFeed
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: feed publico composto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryFeedBundle"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/stories/{storyId}:
    get:
      summary: Resolve um item do feed de Stories
      description: IDs de usuario preservam o UUID do Story pago. Itens administrativos usam prefixo namespaced e sao resolvidos dinamicamente, sem registro de Story.
      operationId: getPublicStoryViewer
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: item de Story resolvido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryViewerPublico"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/anuncios/{slug}/stories:
    get:
      summary: Lista stories publicos autorizados por idade
      description: Stories sao sempre RESTRITA_18. Sem cookie de idade confirmada retorna lista vazia e politica negada; com cookie valido o backend pode retornar metadata segura, sem storage key, bucket, hash ou URL privada.
      operationId: getPublicAnuncioStories
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      responses:
        "200":

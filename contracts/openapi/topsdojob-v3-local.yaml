          in: query
          required: false
          schema: { type: string, format: date }
        - name: fim
          in: query
          required: false
          schema: { type: string, format: date }
        - name: termo
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: modo
          in: query
          required: false
          schema:
            type: string
            enum: [TODOS, CREATE, EDIT]
            default: TODOS
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [TODOS, EM_PREENCHIMENTO, AGUARDANDO_MODERACAO, PUBLICADO, REJEITADO]
            default: TODOS
        - name: uf
          in: query
          required: false
          schema: { type: string, pattern: "^[A-Z]{2}$" }
        - name: cidade
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: kyc
          in: query
          required: false

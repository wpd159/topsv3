        - tamanho
        - totalItens
        - totalPaginas
      properties:
        pagina:
          type: integer
          minimum: 0
        tamanho:
          type: integer
          minimum: 1
        totalItens:
          type: integer
          minimum: 0
        totalPaginas:
          type: integer
          minimum: 0
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - number
        - size
        - hasNext
        - hasPrevious
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    SortItem:
      type: object
      additionalProperties: false
      required:
        - field
        - direction
      properties:
        field:
          type: string
          example: criadoEm
        direction:
          type: string
          enum:
            - asc
            - desc
    FilterItem:
      type: object
      additionalProperties: false
      required:
        - field
        - operation
        - value
      properties:
        field:

          type: number
          exclusiveMinimum: 0
          example: 120
        categoria:
          type: string
          enum: [ACOMPANHANTE_FEMININA, ACOMPANHANTE_MASCULINO, TRANSEX_TRAVESTIS, MASSAGENS, VENDA_DE_CONTEUDO]
          default: ACOMPANHANTE_FEMININA
          example: ACOMPANHANTE_FEMININA
        servicos:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ANAL, ATRIZ_PORNO, FETICHES, MASSAGEM_TANTRICA, ATIVO, BDSM, JOGOS_DE_INTERPRETACAO, ORAL, ATOR_PORNO, EJACULACAO_CORPORAL, MASSAGEM_EROTICA, PASSIVO, NAMORADAS, TRIO, VIDEOCHAMADA]

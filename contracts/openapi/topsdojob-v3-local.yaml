              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeGateGlobalStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/compliance/age-gate/accept:
    post:
      summary: Registra o aceite global
      description: Exige CSRF e emite cookie global HttpOnly assinado por sete dias. Nao emite token reforcado.
      operationId: postPublicComplianceAgeGateAccept
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:

openapi: 3.1.0
info:
  title: Tops do Job V3 Local API
  version: 0.0.1
  description: Contrato minimo local do skeleton, camada transversal e API publica de leitura. A API segue fail-closed: endpoints nao descritos em /api/** nao devem ficar publicos por acidente.
servers:
  - url: http://localhost:8080
    description: backend local
paths:
  /api/health:
    get:
      summary: Health check local do backend
      operationId: getLocalHealth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: backend local disponível
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health/readiness:
    get:
      summary: Readiness check local do backend
      operationId: getLocalReadiness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: backend local pronto para receber tráfego local
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health/liveness:
    get:
      summary: Liveness check local do backend
      operationId: getLocalLiveness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: processo local vivo
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/anuncios/{slug}:
    get:
      summary: Detalhe publico minimo de anuncio por slug
      operationId: getPublicAnuncioBySlug
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      responses:
        "200":
          description: anuncio publico encontrado
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnuncioDetalhePublico"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/anuncios/{slug}/visualizacao:
    post:
      summary: Registra visualizacao publica local de anuncio
      description: Registra somente hashes tecnicos; nao armazena IP, User-Agent ou referer brutos. Conteudo LIVRE e aceito sem idade; conteudo BLOQUEADO exige cookie local de idade confirmada.
      operationId: postPublicAnuncioVisualizacao
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricaPublicaRequest"
      responses:
        "200":
          description: visualizacao registrada localmente
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrarVisualizacaoPublicaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/anuncios/{slug}/clique-whatsapp:
    post:
      summary: Registra clique WhatsApp publico local
      description: Retorna whatsappUrl somente quando a politica backend autoriza anuncio PUBLICADO, APROVADO, nao removido e com contato valido. Conteudo LIVRE pode liberar sem idade; conteudo BLOQUEADO exige cookie local de idade confirmada.
      operationId: postPublicAnuncioCliqueWhatsapp
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricaPublicaRequest"
      responses:
        "200":
          description: clique registrado e politica de contato avaliada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliqueWhatsappPublicoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/anuncios/{slug}/stories:
    get:
      summary: Lista stories publicos autorizados por idade
      description: Sem cookie de idade confirmada retorna lista vazia e politica negada. Com cookie valido, o backend pode retornar metadata segura de stories LIVRE ou BLOQUEADO autorizados, sem storage key, bucket, hash ou URL privada.
      operationId: getPublicAnuncioStories
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
      responses:
        "200":
          description: politica de stories avaliada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaStoriesPublicos"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/idade/status:
    get:
      summary: Consulta status local de confirmacao de idade
      description: Lê somente cookie HttpOnly local; nao usa CPF, documento, localStorage ou sessionStorage.
      operationId: getPublicIdadeStatus
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: status de idade avaliado localmente
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusIdadePublica"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/idade/confirmar:
    post:
      summary: Confirma idade local por declaracao
      description: Em ambiente local aceita CORS apenas de origens localhost configuradas, com credentials para receber cookie HttpOnly.
      description: Recebe somente data de nascimento e declaracao local. Se maior de 18, emite cookie HttpOnly SameSite=Lax; Secure deve ser usado fora de local. Nao usa CPF ou documento.
      operationId: postPublicIdadeConfirmar
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarIdadePublicaRequest"
      responses:
        "200":
          description: idade confirmada e cookie emitido
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: Cookie HttpOnly `topsv3_idade_confirmada`; SameSite=Lax; Secure fora de local.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusIdadePublica"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/acompanhantes/{uf}/{cidade}:
    get:
      summary: Listagem publica minima por cidade
      operationId: getPublicAcompanhantesByCidade
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: uf
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
        - name: cidade
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamanho"
      responses:
        "200":
          description: listagem publica por cidade
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaAnunciosPublica"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/acompanhantes/{uf}/{cidade}/{bairro}:
    get:
      summary: Listagem publica minima por cidade e bairro
      operationId: getPublicAcompanhantesByBairro
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: uf
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
        - name: cidade
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
        - name: bairro
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamanho"
      responses:
        "200":
          description: listagem publica por bairro
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaAnunciosPublica"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/seo/rota:
    get:
      summary: Metadados SEO locais para rota publica preservada
      operationId: getPublicSeoRota
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: caminho
          in: query
          required: true
          description: Caminho publico relativo aceito pela V3 local, incluindo rotas publicas, sitemap e robots.
          schema:
            type: string
            examples:
              - /anuncios/slug-local
              - /acompanhantes/sp/sao-paulo
              - /acompanhantes/sp/sao-paulo/bairro-local
              - /sitemap.xml
              - /robots.txt
      responses:
        "200":
          description: metadados SEO locais
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoRotaPublica"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/auth/login:
    post:
      summary: Login administrativo local por sessao
      description: Autentica usuario administrativo sintetico/local e emite cookie HttpOnly de sessao. Cliente admin deve enviar credentials include. Nao retorna token, senha, hash ou cookie no corpo.
      operationId: postAdminAuthLogin
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: sessao administrativa local criada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/auth/logout:
    post:
      summary: Logout administrativo local
      description: Invalida a sessao local atual via cookie de sessao com credentials include. Nao executa acao administrativa critica.
      operationId: postAdminAuthLogout
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: sessao administrativa local encerrada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/auth/me:
    get:
      summary: Sessao administrativa atual
      description: Retorna usuario, papeis e permissoes da sessao. Nao retorna senha, hash, token ou cookie.
      operationId: getAdminAuthMe
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: sessao administrativa local autenticada
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/auth/permissions:
    get:
      summary: Permissoes administrativas da sessao
      description: Retorna permissao RBAC derivada do backend. Ainda nao libera acoes administrativas reais.
      operationId: getAdminAuthPermissions
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: permissoes RBAC da sessao local
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPermissions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/visao-geral:
    get:
      summary: Visao geral administrativa local somente leitura
      description: Retorna contadores agregados para o shell admin local. Exige sessao/RBAC e nao retorna dado sensivel, documento privado, storage, payload, telefone, senha, hash, token ou cookie.
      operationId: getAdminVisaoGeral
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: visao geral admin read-only
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVisaoGeral"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/anuncios/resumo:
    get:
      summary: Resumo administrativo local de anuncios
      description: Retorna apenas contagens agregadas de anuncios para ADMIN, MODERADOR ou COMERCIAL. Nao retorna WhatsApp real nem dados privados.
      operationId: getAdminAnunciosResumo
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: resumo read-only de anuncios
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResumoAnuncios"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/moderacao/resumo:
    get:
      summary: Resumo administrativo local de moderacao
      description: Retorna apenas contagens agregadas de filas de moderacao para ADMIN ou MODERADOR. Nao executa aprovacao, reprovacao ou escrita.
      operationId: getAdminModeracaoResumo
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: resumo read-only de moderacao
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResumoModeracao"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/midias/resumo:
    get:
      summary: Resumo administrativo local de midias
      description: Retorna apenas contagens agregadas de midias e arquivos para ADMIN ou MODERADOR. Nao retorna bucket, chave de storage, hash, etag ou URL privada.
      operationId: getAdminMidiasResumo
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: resumo read-only de midias
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResumoMidias"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/metricas/resumo:
    get:
      summary: Resumo administrativo local de metricas
      description: Retorna contagens agregadas de visualizacoes e cliques WhatsApp para ADMIN ou COMERCIAL. Nao retorna IP, User-Agent, referer, WhatsApp real ou identificador bruto.
      operationId: getAdminMetricasResumo
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: resumo read-only de metricas
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResumoMetricas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/sistema/status:
    get:
      summary: Status administrativo local do sistema
      description: Retorna estado operacional local para ADMIN. Informa politica fail-closed e pendencias, sem segredo e sem integracao Efi real.
      operationId: getAdminSistemaStatus
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: status admin read-only do sistema
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatusSistema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/anuncios:
    get:
      summary: Lista administrativa local de anuncios
      description: Retorna pagina sanitizada de anuncios. COMERCIAL recebe versao limitada. Nao retorna WhatsApp bruto, documento privado, e-mail privado, valor financeiro sensivel, storage ou payload.
      operationId: getAdminAnuncios
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: statusModeracao
          in: query
          required: false
          schema:
            type: string
        - name: classificacaoConteudo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ClassificacaoConteudoPublica"
        - name: uf
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
        - name: cidade
          in: query
          required: false
          schema:
            type: string
        - name: bairro
          in: query
          required: false
          schema:
            type: string
        - name: termo
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: pagina de anuncios admin read-only
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaginaAnuncios"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/anuncios/{id}:
    get:
      summary: Detalhe administrativo sanitizado de anuncio
      description: Retorna detalhe somente leitura. COMERCIAL nao recebe descricao nem contagem detalhada de revisoes.
      operationId: getAdminAnuncioDetalhe
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: detalhe sanitizado de anuncio
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnuncioDetalhe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/anuncios/{id}/midias:
    get:
      summary: Lista midias sanitizadas de um anuncio
      description: Restrito a ADMIN e MODERADOR. Nao retorna bucket, chave, hash, etag, URL privada ou nome original.
      operationId: getAdminAnuncioMidias
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: pagina de midias do anuncio
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaginaMidias"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/anuncios/{id}/remeter-revisao:
    post:
      summary: Remete anuncio para revisao local
      description: Restrito a ADMIN e MODERADOR com ANUNCIO_MODERAR. Exige motivo valido. Cria revisao local quando nao houver revisao aberta, atualiza anuncio para PENDENTE_REVISAO/PENDENTE, registra auditoria sanitizada e outbox local pendente ANUNCIO_REMETIDO_REVISAO. Nao envia e-mail, WhatsApp ou evento externo, nao executa hard delete, nao faz upload e nao altera pagamento/credito.
      operationId: postAdminAnuncioRemeterRevisao
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRemeterRevisaoRequest"
      responses:
        "200":
          description: anuncio remetido para revisao local
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAcaoModeracaoResponse"
        "400":

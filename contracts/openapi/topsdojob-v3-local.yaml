              schema:
                $ref: "#/components/schemas/VisitorAccessStatus"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/compliance/visitor/document:
    post:
      summary: Envia um documento privado para fallback manual
      description: Aceita exatamente uma imagem JPEG/PNG ou PDF de ate 12 MB, validado por assinatura real e armazenado somente na area documental privada.
      operationId: postPublicComplianceVisitorDocument
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: challengeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [document]
              properties:
                document:
                  type: string
                  format: binary
      responses:
        "202":
          description: documento privado recebido, sem emissao de token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorDocumentSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: documento acima de 12 MB
        "415":
          description: MIME ou assinatura nao permitidos
        "500":
          $ref: "#/components/responses/InternalError"

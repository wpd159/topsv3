          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      description: Retorna Stories com e sem anuncio, inclusive falhas tecnicas e encerramentos recentes, sem carregar original, URL privada, bucket ou object key.
      responses:
        "200":
          description: Pagina de Stories pertencentes exclusivamente a sessao
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeusStoriesPagina"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Publica um Story da conta nos modos ANUNCIO ou MIDIA_UPLOAD
      operationId: publishCurrentUserStory
      security:
        - PublicSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      description: Exige sessao e CSRF. ANUNCIO recebe anuncioId e nenhum arquivo. MIDIA_UPLOAD recebe exatamente uma nova foto ou video e exige anuncioId nulo. O proprietario e sempre derivado da sessao. Nao aceita usuarioId, URL, bucket, object key ou midia existente e nao insere o arquivo na galeria.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [modoConteudo]
              properties:
                modoConteudo:
                  type: string
                  enum: [ANUNCIO, MIDIA_UPLOAD]
                anuncioId:
                  type: string
                  format: uuid
                  description: Obrigatorio somente em ANUNCIO e proibido em MIDIA_UPLOAD.
                arquivo:
                  type: string
                  format: binary
                  description: Obrigatorio somente em MIDIA_UPLOAD. Uma unica foto JPG/JPEG/PNG/WebP ou video MP4 processado pelo pipeline canonico e classificado RESTRITA_18.
      responses:
        "200":
          description: Story publicado ou repeticao idempotente da mesma intencao
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinhaContaStory"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { description: Storage temporariamente indisponivel; nenhum Story e confirmado }

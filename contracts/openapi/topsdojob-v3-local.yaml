  /api/admin/moderacao/revisoes:
    get:
      summary: Lista administrativa local de revisoes
      description: Restrito a ADMIN e MODERADOR. Nao retorna payload de revisao, documento privado ou auditoria sensivel.
      operationId: getAdminModeracaoRevisoes
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query

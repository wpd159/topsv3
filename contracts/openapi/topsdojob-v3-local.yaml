            application/json:
              schema:
                $ref: "#/components/schemas/AdminWizardProgressDashboard"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    PublicSessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessao publica emitida pelo login; cookie HttpOnly, Secure em HML e SameSite Lax.
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessao administrativa local emitida por `POST /api/admin/auth/login`; cliente deve usar credentials include e o corpo da resposta nunca retorna token ou cookie.
  headers:
    RequestId:
      description: Identificador opaco de correlação da requisição.
      schema:
        type: string
        example: 11111111-1111-4111-8111-111111111111
  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave opaca para impedir repeticao da mesma operacao mutavel.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: "^[A-Za-z0-9._:-]+$"
    CurrentUserAdSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,120}$"
    KycSubmissionId:
      name: envioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador opaco enviado pelo cliente para correlação.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{8,128}$"
    Page:
      name: page
      in: query
      required: false
      description: Página baseada em zero.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Quantidade de itens por página, limitada por endpoint.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Ordenação no formato campo,direcao.
      schema:
        type: array
        items:
          type: string
          example: criadoEm,desc
    Pagina:
      name: pagina
      in: query
      required: false
      description: Pagina baseada em zero para endpoints publicos.
      schema:
        type: integer
        minimum: 0
        default: 0
    Tamanho:
      name: tamanho
      in: query
      required: false
      description: Quantidade de itens por pagina publica.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    OrdemSeed:
      name: ordemSeed
      in: query
      required: false
      description: Seed decimal de 64 bits retornada pela primeira pagina da navegacao.
      schema:
        type: string
        pattern: "^-?[0-9]+$"
        maxLength: 20
  responses:
    BadRequest:
      description: Parametro invalido ou rota publica proibida.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: Recurso publico nao encontrado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: Autenticacao necessaria ou credenciais invalidas.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: Usuario autenticado sem permissao suficiente.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: Estado atual impede a transicao solicitada.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnprocessableEntity:
      description: Dados sintaticamente validos, mas incompativeis com as regras da operacao.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    PayloadTooLarge:
      description: Arquivo acima do limite permitido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnsupportedMediaType:
      description: Formato binario ou extensao nao permitidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    BadGateway:
      description: A Efí rejeitou ou nao respondeu a operacao; nenhum credito foi gerado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ServiceUnavailable:
      description: Integracao Efí desabilitada ou configuracao segura incompleta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    TooManyRequests:
      description: Limite temporario de operacoes excedido; nenhuma cobranca ou credito adicional foi criado.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InternalError:
      description: Falha inesperada sem detalhes internos.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    KycDocumento:
      type: object
      additionalProperties: false
      required: [id, parte, status, mimeType, tamanhoBytes]
      properties:
        id:
          type: string
          format: uuid
        parte:
          type: string
          enum: [UNICO, FRENTE, VERSO]
        status:
          type: string
        mimeType:
          type: [string, "null"]
        tamanhoBytes:
          type: integer
          format: int64
          minimum: 0
    KycStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - nomeCivil
        - cpfPreenchido
        - cpfMascarado
        - dataNascimento
        - motivo
        - prontoParaEnviarAnuncio
        - podeReenviar
        - tamanhoMaximoBytes
        - formatosAceitos
        - documentos
      properties:
        status:
          type: string

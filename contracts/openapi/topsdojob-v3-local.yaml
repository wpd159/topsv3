              ativo: { type: boolean }
              ordemExibicao: { type: integer, minimum: 0 }
    AdminPlanoCreditoUpdateRequest:
      type: object
      additionalProperties: false
      required: [nome, descricao, quantidadeCreditos, valor, ativo, ordemExibicao]
      properties:

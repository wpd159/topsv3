      responses:
        "200":
          description: aceite global registrado
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: Cookies HttpOnly assinados `age_gate_accepted` e `visitor_session_id`; SameSite=Lax; Secure fora de local.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeGateGlobalStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/compliance/visitor/challenge:
    post:
      summary: Cria challenge contextual de verificacao reforcada
      description: Exige aceite global e CSRF. O challenge e opaco, antirreplay, idempotente, limitado por sessao e vinculado ao contexto protegido sanitizado. Em STORY, o cliente envia somente storyId; o backend deriva anuncio, arquivo e proprietario. ANUNCIO exige anuncioId no dominio derivado e MIDIA_UPLOAD mantem anuncioId nulo.
      operationId: postPublicComplianceVisitorChallenge
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorChallengeRequest"
      responses:
        "200":
          description: challenge criado ou recuperado pela mesma idempotencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          description: limite temporario de challenges atingido
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/compliance/visitor/verify:
    post:
      summary: Verifica os dados reforcados do visitante
      description: Valida nascimento repetido, maioridade, CPF, aceites, risco e challenge. Token bruto nunca e persistido; somente hashes seguros sao armazenados. A concessao geral e global para o mesmo visitante e nivel, por 10.080 minutos, sem vinculo obrigatorio ao storyId originador; requisitos adicionais de escopo continuam validos.
      operationId: postPublicComplianceVisitorVerify
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorVerifyRequest"
      responses:
        "200":
          description: verificacao concluida e cookies gerais ou explicitos emitidos conforme a politica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorAccessStatus"
        "202":
          description: fallback documental necessario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorAccessStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: challenge expirado
        "422":
          description: dados ou aceites invalidos
        "429":
          description: verificacao temporariamente bloqueada
        "500":
          $ref: "#/components/responses/InternalError"
  /api/public/compliance/visitor/status:
    get:
      summary: Consulta autorizacoes reforcadas da sessao
      description: Valida no backend cookies HttpOnly assinados, identidade da sessao, hashes persistidos, nivel global, requisitos de escopo, expiracao e revogacao.
      operationId: getPublicComplianceVisitorStatus
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":

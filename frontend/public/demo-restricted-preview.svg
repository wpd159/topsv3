<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-label="Preview demo local restrito">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20131a"/>
      <stop offset="100%" stop-color="#4b2038"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="380" cy="300" r="135" fill="#f3b0cb"/>
    <rect x="200" y="500" width="390" height="390" rx="130" fill="#f1bdd3"/>
  </g>
  <rect x="90" y="920" width="620" height="170" rx="28" fill="#ffffff" opacity="0.88"/>
  <text x="400" y="985" text-anchor="middle" font-size="42" font-family="Arial, Helvetica, sans-serif" fill="#111111">
    Conteudo restrito 18+
  </text>
  <text x="400" y="1038" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#444444">
    Preview local com blur para visitante
  </text>
</svg>

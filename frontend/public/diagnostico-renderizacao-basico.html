<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Teste básico de renderização</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    color: #111111;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }

  h1 {
    font-size: 20px;
  }

  p {
    font-size: 14px;
    color: #333333;
  }

  input,
  textarea {
    display: block;
    width: 100%;
    padding: 16px;
    border: 1px solid #9ca3af;
    border-radius: 12px;
    background: #f3f4f6;
    color: #111111;
    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif;
    margin-bottom: 16px;
    box-sizing: border-box;
    outline: none;
  }

  input:focus,
  textarea:focus {
    border-color: #FC1EAD;
  }

  button {
    display: block;
    width: 100%;
    padding: 16px;
    border: 1px solid #9ca3af;
    border-radius: 12px;
    background: #f3f4f6;
    color: #111111;
    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Teste básico de renderização</h1>
    <p>Toque em cada campo, digite algo, apague e role a página. Observe se aparece qualquer mancha, sobra visual ou repetição de texto na tela.</p>

    <input type="text" placeholder="Campo de texto">
    <input type="tel" placeholder="Campo de telefone">
    <input type="email" placeholder="Campo de e-mail">
    <input type="password" placeholder="Campo de senha">
    <textarea rows="4" placeholder="Campo de texto longo"></textarea>
    <button type="button">Botão simples</button>
  </div>
</body>
</html>

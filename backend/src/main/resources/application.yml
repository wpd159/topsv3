spring:
  application:
    name: topsdojob-v3-backend
  main:
    banner-mode: "off"
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8080

app:
  env: ${APP_ENV:local}
  canonical-domain: ${APP_CANONICAL_DOMAIN:http://localhost}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

efi:
  pix:
    mock-mode: ${EFI_PIX_MOCK_MODE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

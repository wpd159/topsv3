spring:
  application:
    name: topsdojob-v3-backend
  main:
    banner-mode: "off"
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_REQUEST_BYTES:105MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_BYTES:105MB}
  mail:
    host: ${OUTBOX_SMTP_HOST:localhost}
    port: ${OUTBOX_SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${OUTBOX_SMTP_AUTH:false}
          starttls:
            enable: ${OUTBOX_SMTP_STARTTLS:false}
            required: ${OUTBOX_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${OUTBOX_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${OUTBOX_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${OUTBOX_SMTP_WRITE_TIMEOUT_MS:10000}

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${APP_ADMIN_SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  env: ${APP_ENV:nao_configurado}
  auth:
    hml-code-vault-enabled: ${APP_AUTH_HML_CODE_VAULT_ENABLED:false}
    security-token-ttl-seconds: ${APP_AUTH_SECURITY_TOKEN_TTL_SECONDS:900}
  outbox:
    email:
      enabled: ${OUTBOX_EMAIL_ENABLED:false}
      encryption-key: ${OUTBOX_PAYLOAD_ENCRYPTION_KEY:}
      recipient-mode: ${OUTBOX_RECIPIENT_MODE:CAPTURE}
      capture-address: ${OUTBOX_CAPTURE_ADDRESS:capture@preprod.invalid}
      allowed-recipients: ${OUTBOX_ALLOWED_RECIPIENTS:}
      sender-address: ${OUTBOX_SENDER_ADDRESS:no-reply@topsdojob.com}
      sender-name: ${OUTBOX_SENDER_NAME:Tops do Job}
      reply-to: ${OUTBOX_REPLY_TO:}
      poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}
      batch-size: ${OUTBOX_BATCH_SIZE:10}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
      retry-base-seconds: ${OUTBOX_RETRY_BASE_SECONDS:30}
  canonical-domain: ${APP_CANONICAL_DOMAIN:http://localhost}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  storage:
    r2:
      enabled: ${R2_ENABLED:false}
      endpoint: ${R2_ENDPOINT:}
      region: ${R2_REGION:auto}
      access-key: ${R2_ACCESS_KEY:}
      signing-value: ${R2_SIGNING_VALUE:}
      public-media-bucket: ${R2_PUBLIC_MEDIA_BUCKET:}
      private-media-bucket: ${R2_PRIVATE_MEDIA_BUCKET:}
      document-bucket: ${R2_DOCUMENT_BUCKET:}
      public-media-prefix: ${R2_PUBLIC_MEDIA_PREFIX:hml/midias-aprovadas/}
      private-media-prefix: ${R2_PRIVATE_MEDIA_PREFIX:hml/midias-pendentes/}
      document-prefix: ${R2_DOCUMENT_PREFIX:hml/documentos/}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      preserved-public-media-bucket: ${R2_PRESERVED_PUBLIC_MEDIA_BUCKET:}
      preserved-public-media-prefix: ${R2_PRESERVED_PUBLIC_MEDIA_PREFIX:}
      preserved-public-base-url: ${R2_PRESERVED_PUBLIC_BASE_URL:}
      signed-url-ttl-seconds: ${R2_SIGNED_URL_TTL_SECONDS:300}
  media-upload:
    max-image-bytes: ${UPLOAD_MAX_IMAGE_BYTES:20971520}
    max-video-bytes: ${UPLOAD_MAX_VIDEO_BYTES:104857600}
    max-image-pixels: ${UPLOAD_MAX_IMAGE_PIXELS:40000000}
    max-image-dimension: ${UPLOAD_MAX_IMAGE_DIMENSION:20000}
    max-processed-side: ${UPLOAD_MAX_PROCESSED_SIDE:2560}
    jpeg-quality: ${UPLOAD_JPEG_QUALITY:0.92}
    webp-quality: ${UPLOAD_WEBP_QUALITY:0.90}
  document-upload:
    max-bytes: ${UPLOAD_MAX_DOCUMENT_BYTES:12582912}

efi:
  pix:
    enabled: ${EFI_ENABLED:false}
    environment: ${EFI_ENVIRONMENT:homologacao}
    base-url: ${EFI_BASE_URL:https://pix-h.api.efipay.com.br}
    client-id: ${EFI_CLIENT_ID:}
    client-secret: ${EFI_CLIENT_SECRET:}
    certificate-path: ${EFI_CERTIFICATE_PATH:}
    certificate-protection: ${EFI_CERTIFICATE_PROTECTION_VALUE:}
    pix-key: ${EFI_PIX_KEY:}
    webhook-base-url: ${EFI_WEBHOOK_BASE_URL:}
    webhook-verifier: ${EFI_WEBHOOK_VERIFIER_VALUE:}
    webhook-registration-enabled: ${EFI_WEBHOOK_REGISTRATION_ENABLED:false}
    webhook-skip-mtls-checking: ${EFI_WEBHOOK_SKIP_MTLS_CHECKING:false}
    charge-expiration-seconds: ${EFI_CHARGE_EXPIRATION_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

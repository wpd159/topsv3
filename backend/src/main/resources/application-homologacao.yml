spring:
  config:
    activate:
      on-profile: homologacao
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: topsv3-hml
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  sql:
    init:
      mode: never

app:
  env: ${APP_ENV:homologacao}
  auth:
    hml-code-vault-enabled: ${APP_AUTH_HML_CODE_VAULT_ENABLED:false}
  outbox:
    email:
      enabled: ${OUTBOX_EMAIL_ENABLED:false}
      encryption-key: ${OUTBOX_PAYLOAD_ENCRYPTION_KEY}
      recipient-mode: CAPTURE
      capture-address: ${OUTBOX_CAPTURE_ADDRESS:capture@preprod.invalid}
  canonical-domain: ${APP_CANONICAL_DOMAIN:https://v3.esle.cloud}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  event:
    hash-salt: ${APP_EVENT_HASH_SALT}
  age-gate:
    signing-value: ${APP_AGE_GATE_SIGNING_VALUE}

efi:
  pix:
    enabled: ${EFI_ENABLED:false}
    environment: homologacao
    base-url: https://pix-h.api.efipay.com.br

server:
  port: ${TOPSV3_BACKEND_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${APP_ADMIN_SESSION_COOKIE_SECURE:true}
        same-site: lax

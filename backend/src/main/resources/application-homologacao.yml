spring:
  config:
    activate:
      on-profile: homologacao
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: topsv3-hml
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  sql:
    init:
      mode: never

app:
  env: ${APP_ENV:homologacao}
  canonical-domain: ${APP_CANONICAL_DOMAIN:https://v3.esle.cloud}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  event:
    hash-salt: ${APP_EVENT_HASH_SALT}
  age-gate:
    signing-value: ${APP_AGE_GATE_SIGNING_VALUE}

efi:
  pix:
    mock-mode: ${EFI_PIX_MOCK_MODE:true}

server:
  port: ${TOPSV3_BACKEND_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${APP_ADMIN_SESSION_COOKIE_SECURE:true}
        same-site: lax

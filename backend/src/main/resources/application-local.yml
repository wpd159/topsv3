spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: topsv3-local-descartavel
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  sql:
    init:
      mode: never

app:
  env: ${APP_ENV:local}
  canonical-domain: ${APP_CANONICAL_DOMAIN:http://localhost}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  event:
    hash-salt: ${APP_EVENT_HASH_SALT:valor_local_ficticio}
  age-gate:
    signing-value: ${APP_AGE_GATE_SIGNING_VALUE:valor_local_ficticio_idade}

efi:
  pix:
    enabled: false
    environment: homologacao
    base-url: https://pix-h.api.efipay.com.br

server:
  port: ${TOPSV3_BACKEND_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${APP_ADMIN_SESSION_COOKIE_SECURE:false}
        same-site: lax

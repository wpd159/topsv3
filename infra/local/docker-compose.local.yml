name: ${COMPOSE_PROJECT_NAME:-topsv3-local}

services:
  postgres:
    image: ${TOPSV3_POSTGRES_IMAGE:-postgres:16.6-alpine}
    container_name: topsv3-postgres-local
    restart: unless-stopped
    env_file:
      - .env.local.example
    environment:
      POSTGRES_DB: ${TOPSV3_POSTGRES_DB:-topsv3_local}
      POSTGRES_USER: ${TOPSV3_POSTGRES_USER:-topsv3_local}
    ports:
      - "${TOPSV3_POSTGRES_PORT:-54329}:5432"
    volumes:
      - ../../storage-local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - topsv3-local

  minio:
    image: ${TOPSV3_MINIO_IMAGE:-minio/minio:RELEASE.2024-07-16T23-46-41Z}
    container_name: topsv3-minio-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env.local.example
    ports:
      - "${TOPSV3_MINIO_API_PORT:-9000}:9000"
      - "${TOPSV3_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ../../storage-local/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - topsv3-local

  mailpit:
    image: ${TOPSV3_MAILPIT_IMAGE:-axllent/mailpit:v1.20.4}
    container_name: topsv3-mailpit-local
    restart: unless-stopped
    env_file:
      - .env.local.example
    ports:
      - "${TOPSV3_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${TOPSV3_MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - topsv3-local

networks:
  topsv3-local:
    name: topsv3-local

name: ${V2_PROJECT_NAME:-topsdojob-v2-lab}

services:
  postgres:
    image: ${V2_POSTGRES_IMAGE:?V2_POSTGRES_IMAGE obrigatoria}
    environment:
      POSTGRES_DB: topsdojob_v2
      POSTGRES_USER: topsdojob_v2
      POSTGRES_PASSWORD: ${V2_DB_PASSWORD:?V2_DB_PASSWORD obrigatoria}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topsdojob_v2 -d topsdojob_v2"]
      interval: 1s
      timeout: 2s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [lab]

  flyway:
    image: ${V2_FLYWAY_IMAGE:?V2_FLYWAY_IMAGE obrigatoria}
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/topsdojob_v2
      FLYWAY_USER: topsdojob_v2
      FLYWAY_PASSWORD: ${V2_DB_PASSWORD:?V2_DB_PASSWORD obrigatoria}
      FLYWAY_CONNECT_RETRIES: "30"
    volumes:
      - ../../backend/src/main/resources/db/migration:/flyway/sql:ro
    networks: [lab]

  minio:
    image: ${V2_MINIO_IMAGE:?V2_MINIO_IMAGE obrigatoria}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${V2_MINIO_ACCESS_KEY:?V2_MINIO_ACCESS_KEY obrigatoria}
      MINIO_ROOT_PASSWORD: ${V2_MINIO_SECRET_KEY:?V2_MINIO_SECRET_KEY obrigatoria}
    volumes:
      - minio-data:/data
      - ${V2_RUNTIME_DIR:?V2_RUNTIME_DIR obrigatoria}/certs/minio:/root/.minio/certs:ro
    ports:
      - "127.0.0.1::9000"
    networks: [lab]

  mailpit:
    image: ${V2_MAILPIT_IMAGE:?V2_MAILPIT_IMAGE obrigatoria}
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    networks: [lab]

  efi-stub:
    image: ${V2_NODE_IMAGE:?V2_NODE_IMAGE obrigatoria}
    command:
      - node
      - -e
      - >-
        require('node:http').createServer((request,response)=>{
          response.writeHead(200,{'content-type':'application/json','cache-control':'no-store'});
          response.end(JSON.stringify({status:'UP',provider:'local-stub'}));
        }).listen(8090,'0.0.0.0');
    networks: [lab]

  backend:
    image: ${V2_BACKEND_IMAGE:?V2_BACKEND_IMAGE obrigatoria}
    build:
      context: ../../backend
      args:
        V2_MAVEN_IMAGE: ${V2_MAVEN_IMAGE:?V2_MAVEN_IMAGE obrigatoria}
        V2_JRE_IMAGE: ${V2_JRE_IMAGE:?V2_JRE_IMAGE obrigatoria}
      dockerfile_inline: |
        ARG V2_MAVEN_IMAGE
        ARG V2_JRE_IMAGE
        FROM $${V2_MAVEN_IMAGE} AS build
        WORKDIR /workspace
        COPY pom.xml .
        RUN mvn --batch-mode --no-transfer-progress -DskipTests dependency:go-offline
        COPY src ./src
        RUN mvn --batch-mode --no-transfer-progress -DskipTests package
        FROM $${V2_JRE_IMAGE}
        WORKDIR /app
        COPY --from=build /workspace/target/*.jar /app/app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: homologacao
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/topsdojob_v2
      SPRING_DATASOURCE_USERNAME: topsdojob_v2
      SPRING_DATASOURCE_PASSWORD: ${V2_DB_PASSWORD:?V2_DB_PASSWORD obrigatoria}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_TASK_SCHEDULING_ENABLED: "false"
      TOPSV3_BACKEND_PORT: "8080"
      APP_ENV: pipeline-v2
      APP_CANONICAL_DOMAIN: http://gateway:8080
      APP_CORS_ALLOWED_ORIGINS: http://gateway:8080
      APP_ADMIN_SESSION_COOKIE_SECURE: "false"
      APP_EVENT_HASH_SALT: pipeline-v2-event-hash-salt-only
      APP_AGE_GATE_SIGNING_VALUE: pipeline-v2-age-gate-signing-value-only
      OUTBOX_EMAIL_ENABLED: "false"
      OUTBOX_PAYLOAD_ENCRYPTION_KEY: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      OUTBOX_SMTP_HOST: mailpit
      OUTBOX_SMTP_PORT: "1025"
      OUTBOX_SMTP_AUTH: "false"
      OUTBOX_SMTP_STARTTLS: "false"
      OUTBOX_SMTP_STARTTLS_REQUIRED: "false"
      EFI_ENABLED: "false"
      EFI_BASE_URL: http://efi-stub:8090
      EFI_PIX_BASE_URL: http://efi-stub:8090
      EFI_RECONCILIATION_ENABLED: "false"
      EFI_WEBHOOK_REGISTRATION_ENABLED: "false"
      R2_ENABLED: "true"
      R2_ENDPOINT: https://minio:9000
      R2_REGION: us-east-1
      R2_ACCESS_KEY: ${V2_MINIO_ACCESS_KEY:?V2_MINIO_ACCESS_KEY obrigatoria}
      R2_SIGNING_VALUE: ${V2_MINIO_SECRET_KEY:?V2_MINIO_SECRET_KEY obrigatoria}
      R2_PUBLIC_MEDIA_BUCKET: topsdojob-v2-public
      R2_PRIVATE_MEDIA_BUCKET: topsdojob-v2-private
      R2_DOCUMENT_BUCKET: topsdojob-v2-documents
      R2_PUBLIC_MEDIA_PREFIX: hml/midias-aprovadas/
      R2_PRIVATE_MEDIA_PREFIX: hml/midias-pendentes/
      R2_DOCUMENT_PREFIX: hml/documentos/
      R2_PUBLIC_BASE_URL: https://minio:9000/topsdojob-v2-public
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/run/pipeline-v2/truststore.p12
        -Djavax.net.ssl.trustStorePassword=pipeline-v2-trust
        -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ${V2_RUNTIME_DIR:?V2_RUNTIME_DIR obrigatoria}/certs/truststore.p12:/run/pipeline-v2/truststore.p12:ro
      - ${V2_RUNTIME_DIR:?V2_RUNTIME_DIR obrigatoria}/reports:/reports
    ports:
      - "127.0.0.1::8080"
    networks: [lab]

  frontend:
    image: ${V2_FRONTEND_IMAGE:?V2_FRONTEND_IMAGE obrigatoria}
    build:
      context: ../../frontend
      args:
        V2_NODE_IMAGE: ${V2_NODE_IMAGE:?V2_NODE_IMAGE obrigatoria}
        NEXT_PUBLIC_SITE_URL: http://gateway:8080
        NEXT_PUBLIC_API_URL: http://gateway:8080/api/public
        PUBLIC_API_TIMEOUT_MS: "5000"
        NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
        NEXT_PUBLIC_FORCE_HTTPS: "false"
        NEXT_PUBLIC_EFI_PIX_ENABLED: "false"
        SEARCH_INDEXING_MODE: blocked
      dockerfile_inline: |
        ARG V2_NODE_IMAGE
        FROM $${V2_NODE_IMAGE} AS deps
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --cache /tmp/npm-cache && rm -rf /tmp/npm-cache
        FROM $${V2_NODE_IMAGE} AS build
        WORKDIR /app
        ENV NEXT_TELEMETRY_DISABLED=1
        ARG NEXT_PUBLIC_SITE_URL
        ARG NEXT_PUBLIC_API_URL
        ARG PUBLIC_API_TIMEOUT_MS
        ARG NEXT_PUBLIC_ANALYTICS_ENABLED
        ARG NEXT_PUBLIC_FORCE_HTTPS
        ARG NEXT_PUBLIC_EFI_PIX_ENABLED
        ARG SEARCH_INDEXING_MODE
        ENV NEXT_PUBLIC_SITE_URL=$${NEXT_PUBLIC_SITE_URL}
        ENV NEXT_PUBLIC_API_URL=$${NEXT_PUBLIC_API_URL}
        ENV PUBLIC_API_TIMEOUT_MS=$${PUBLIC_API_TIMEOUT_MS}
        ENV NEXT_PUBLIC_ANALYTICS_ENABLED=$${NEXT_PUBLIC_ANALYTICS_ENABLED}
        ENV NEXT_PUBLIC_FORCE_HTTPS=$${NEXT_PUBLIC_FORCE_HTTPS}
        ENV NEXT_PUBLIC_EFI_PIX_ENABLED=$${NEXT_PUBLIC_EFI_PIX_ENABLED}
        ENV SEARCH_INDEXING_MODE=$${SEARCH_INDEXING_MODE}
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN npm run build
        FROM $${V2_NODE_IMAGE}
        WORKDIR /app
        ENV NODE_ENV=production
        ENV NEXT_TELEMETRY_DISABLED=1
        ENV PORT=3000
        ENV HOSTNAME=0.0.0.0
        COPY --from=build --chown=node:node /app/public ./public
        COPY --from=build --chown=node:node /app/.next/standalone ./
        COPY --from=build --chown=node:node /app/.next/static ./.next/static
        RUN mkdir -p .next/cache && chown -R node:node .next
        USER node
        EXPOSE 3000
        CMD ["node", "server.js"]
    environment:
      NEXT_PUBLIC_SITE_URL: http://gateway:8080
      NEXT_PUBLIC_API_URL: http://gateway:8080/api/public
      INTERNAL_API_URL: http://backend:8080/api/public
      PUBLIC_API_TIMEOUT_MS: "5000"
      HEALTH_READINESS_TIMEOUT_MS: "1500"
      NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
      NEXT_PUBLIC_FORCE_HTTPS: "false"
      NEXT_PUBLIC_EFI_PIX_ENABLED: "false"
      SEARCH_INDEXING_MODE: blocked
    ports:
      - "127.0.0.1::3000"
    networks: [lab]

  gateway:
    image: ${V2_GATEWAY_IMAGE:?V2_GATEWAY_IMAGE obrigatoria}
    build:
      context: ../..
      args:
        V2_NGINX_IMAGE: ${V2_NGINX_IMAGE:?V2_NGINX_IMAGE obrigatoria}
      dockerfile_inline: |
        ARG V2_NGINX_IMAGE
        FROM $${V2_NGINX_IMAGE}
        RUN rm -f /etc/nginx/conf.d/default.conf && printf '%s\n' \
          'server {' \
          '  listen 8080;' \
          '  server_tokens off;' \
          '  location /api/ {' \
          '    proxy_set_header Host $$host;' \
          '    proxy_set_header X-Forwarded-Proto $$scheme;' \
          '    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;' \
          '    proxy_pass http://backend:8080;' \
          '  }' \
          '  location / {' \
          '    proxy_set_header Host $$host;' \
          '    proxy_set_header X-Forwarded-Proto $$scheme;' \
          '    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;' \
          '    proxy_pass http://frontend:3000;' \
          '  }' \
          '}' > /etc/nginx/conf.d/default.conf
        EXPOSE 8080
    ports:
      - "127.0.0.1::8080"
    networks: [lab]

networks:
  lab:
    internal: true

volumes:
  postgres-data:
  minio-data:

name: topsv3-preprod

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: topsv3-preprod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TOPSV3_POSTGRES_DB:-topsv3_preprod}
      POSTGRES_USER: ${TOPSV3_POSTGRES_USER:-topsv3_preprod}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/preprod.env}
    volumes:
      - topsv3-preprod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - topsv3-preprod-net

  flyway:
    image: flyway/flyway:12.10.0-alpine
    container_name: topsv3-preprod-flyway
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${TOPSV3_POSTGRES_DB:-topsv3_preprod}
      FLYWAY_USER: ${TOPSV3_POSTGRES_USER:-topsv3_preprod}
      FLYWAY_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/preprod.env}
      FLYWAY_CONNECT_RETRIES: "60"
    command: ["migrate"]
    volumes:
      - ../../backend/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - topsv3-preprod-net

  backend:
    container_name: topsv3-preprod-backend
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
    build:
      context: ../../backend
      dockerfile_inline: |
        FROM maven:3.9.9-eclipse-temurin-17 AS build
        WORKDIR /workspace
        COPY pom.xml .
        RUN mvn -q -DskipTests dependency:go-offline
        COPY src ./src
        RUN mvn -q -DskipTests package
        FROM eclipse-temurin:17.0.13_11-jre
        WORKDIR /app
        COPY --from=build /workspace/target/*.jar /app/app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    command:
      - --app.hml-admin-provision.enabled=false
      - --app.hml-fixture.enabled=false
      - --app.hml-fixture-owner-credential.enabled=false
      - --app.hml-auth-smoke.enabled=false
    environment:
      SPRING_PROFILES_ACTIVE: homologacao
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${TOPSV3_POSTGRES_DB:-topsv3_preprod}
      SPRING_DATASOURCE_USERNAME: ${TOPSV3_POSTGRES_USER:-topsv3_preprod}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/preprod.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/preprod.env}
      TOPSV3_BACKEND_PORT: 8080
      APP_ENV: preproducao
      APP_AUTH_HML_CODE_VAULT_ENABLED: "false"
      APP_CANONICAL_DOMAIN: http://preprod.localhost:23000
      APP_CORS_ALLOWED_ORIGINS: http://preprod.localhost:23000
      APP_ADMIN_SESSION_COOKIE_SECURE: "false"
      APP_EVENT_HASH_SALT: ${APP_EVENT_HASH_SALT:?defina APP_EVENT_HASH_SALT em /opt/topsv3/secrets/preprod.env}
      APP_AGE_GATE_SIGNING_VALUE: ${APP_AGE_GATE_SIGNING_VALUE:?defina APP_AGE_GATE_SIGNING_VALUE em /opt/topsv3/secrets/preprod.env}
      EFI_ENABLED: "false"
      R2_ENABLED: ${R2_ENABLED:?defina R2_ENABLED em /opt/topsv3/secrets/preprod.env}
      R2_ENDPOINT: ${R2_ENDPOINT:?defina R2_ENDPOINT em /opt/topsv3/secrets/preprod.env}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?defina R2_ACCESS_KEY em /opt/topsv3/secrets/preprod.env}
      R2_SIGNING_VALUE: ${R2_SIGNING_VALUE:?defina R2_SIGNING_VALUE em /opt/topsv3/secrets/preprod.env}
      R2_PUBLIC_MEDIA_BUCKET: ${R2_PUBLIC_MEDIA_BUCKET:?defina R2_PUBLIC_MEDIA_BUCKET em /opt/topsv3/secrets/preprod.env}
      R2_PRIVATE_MEDIA_BUCKET: ${R2_PRIVATE_MEDIA_BUCKET:?defina R2_PRIVATE_MEDIA_BUCKET em /opt/topsv3/secrets/preprod.env}
      R2_DOCUMENT_BUCKET: ${R2_DOCUMENT_BUCKET:?defina R2_DOCUMENT_BUCKET em /opt/topsv3/secrets/preprod.env}
      R2_PUBLIC_MEDIA_PREFIX: ${R2_PUBLIC_MEDIA_PREFIX:-hml/preprod/midias-aprovadas/}
      R2_PRIVATE_MEDIA_PREFIX: ${R2_PRIVATE_MEDIA_PREFIX:-hml/preprod/midias-pendentes/}
      R2_DOCUMENT_PREFIX: ${R2_DOCUMENT_PREFIX:-hml/preprod/documentos/}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?defina R2_PUBLIC_BASE_URL em /opt/topsv3/secrets/preprod.env}
      R2_PRESERVED_PUBLIC_MEDIA_BUCKET: ""
      R2_PRESERVED_PUBLIC_MEDIA_PREFIX: ""
      R2_PRESERVED_PUBLIC_BASE_URL: ""
      R2_SIGNED_URL_TTL_SECONDS: ${R2_SIGNED_URL_TTL_SECONDS:-300}
      UPLOAD_MAX_DOCUMENT_BYTES: ${UPLOAD_MAX_DOCUMENT_BYTES:-12582912}
    ports:
      - "127.0.0.1:28080:8080"
    networks:
      - topsv3-preprod-net

  frontend:
    container_name: topsv3-preprod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://preprod.localhost:23000
        NEXT_PUBLIC_API_URL: http://preprod.localhost:23000/api/public
        NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
        NEXT_PUBLIC_FORCE_HTTPS: "false"
      dockerfile_inline: |
        FROM node:22.13.1-alpine AS deps
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        FROM node:22.13.1-alpine AS build
        WORKDIR /app
        ENV NEXT_TELEMETRY_DISABLED=1
        ARG NEXT_PUBLIC_SITE_URL
        ARG NEXT_PUBLIC_API_URL
        ARG NEXT_PUBLIC_ANALYTICS_ENABLED
        ARG NEXT_PUBLIC_FORCE_HTTPS
        ENV NEXT_PUBLIC_SITE_URL=$${NEXT_PUBLIC_SITE_URL}
        ENV NEXT_PUBLIC_API_URL=$${NEXT_PUBLIC_API_URL}
        ENV NEXT_PUBLIC_ANALYTICS_ENABLED=$${NEXT_PUBLIC_ANALYTICS_ENABLED}
        ENV NEXT_PUBLIC_FORCE_HTTPS=$${NEXT_PUBLIC_FORCE_HTTPS}
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN npm run build
        FROM node:22.13.1-alpine AS runtime
        WORKDIR /app
        ENV NODE_ENV=production
        ENV NEXT_TELEMETRY_DISABLED=1
        ENV NEXT_PUBLIC_SITE_URL=http://preprod.localhost:23000
        ENV NEXT_PUBLIC_API_URL=http://preprod.localhost:23000/api/public
        ENV NEXT_PUBLIC_ANALYTICS_ENABLED=false
        ENV NEXT_PUBLIC_FORCE_HTTPS=false
        COPY --from=build /app/package.json ./package.json
        COPY --from=build /app/package-lock.json ./package-lock.json
        COPY --from=build /app/node_modules ./node_modules
        COPY --from=build /app/.next ./.next
        RUN rm -rf .next/cache
        COPY --from=build /app/public ./public
        EXPOSE 3000
        CMD ["npm", "run", "start", "--", "-p", "3000", "-H", "0.0.0.0"]
    networks:
      - topsv3-preprod-net

  gateway:
    image: nginx:1.27-alpine
    container_name: topsv3-preprod-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./nginx-preprod-local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:23000:23000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:23000/robots.txt | grep -q 'Disallow: /'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      topsv3-preprod-net:
        aliases:
          - preprod.localhost

networks:
  topsv3-preprod-net:
    name: topsv3-preprod-net

volumes:
  topsv3-preprod-postgres-data:
    name: topsv3-preprod-postgres-data

name: topsv3-production

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: topsv3-production-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TOPSV3_POSTGRES_DB:-topsv3}
      POSTGRES_USER: ${TOPSV3_POSTGRES_USER:-topsv3}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/production.env}
    volumes:
      - topsv3-production-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - topsv3-production-net

  flyway:
    image: flyway/flyway:12.10.0-alpine
    container_name: topsv3-production-flyway
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${TOPSV3_POSTGRES_DB:-topsv3}
      FLYWAY_USER: ${TOPSV3_POSTGRES_USER:-topsv3}
      FLYWAY_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/production.env}
      FLYWAY_CONNECT_RETRIES: "60"
    command: ["migrate"]
    volumes:
      - ../../backend/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - topsv3-production-net

  backend:
    image: topsv3-production-backend:${TOPSV3_RELEASE_SHA:?TOPSV3_RELEASE_SHA obrigatorio}
    container_name: topsv3-production-backend
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
    build:
      context: ../../backend
      dockerfile_inline: |
        FROM maven:3.9.9-eclipse-temurin-17 AS build
        WORKDIR /workspace
        COPY pom.xml .
        RUN mvn -q -DskipTests dependency:go-offline
        COPY src ./src
        RUN mvn -q -DskipTests package
        FROM eclipse-temurin:17.0.13_11-jre
        WORKDIR /app
        COPY --from=build /workspace/target/*.jar /app/app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    command:
      - --app.fixture.admin-provision.enabled=false
      - --app.fixture.stories.enabled=false
      - --app.fixture.owner-credential.enabled=false
      - --app.fixture.auth-smoke.enabled=false
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/topsv3-config/application-production.yml
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${TOPSV3_POSTGRES_DB:-topsv3}
      SPRING_DATASOURCE_USERNAME: ${TOPSV3_POSTGRES_USER:-topsv3}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/production.env}
      TOPSV3_BACKEND_PORT: "8080"
      APP_ENV: producao
      APP_AUTH_HML_CODE_VAULT_ENABLED: "false"
      APP_CANONICAL_DOMAIN: https://topsdojob.com
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://topsdojob.com,https://www.topsdojob.com}
      APP_ADMIN_SESSION_COOKIE_SECURE: "true"
      APP_EVENT_HASH_SALT: ${APP_EVENT_HASH_SALT:?APP_EVENT_HASH_SALT obrigatoria}
      APP_AGE_GATE_SIGNING_VALUE: ${APP_AGE_GATE_SIGNING_VALUE:?APP_AGE_GATE_SIGNING_VALUE obrigatorio}
      OUTBOX_EMAIL_ENABLED: ${OUTBOX_EMAIL_ENABLED:-true}
      OUTBOX_PAYLOAD_ENCRYPTION_KEY: ${OUTBOX_PAYLOAD_ENCRYPTION_KEY:?OUTBOX_PAYLOAD_ENCRYPTION_KEY obrigatoria}
      OUTBOX_RECIPIENT_MODE: ${OUTBOX_RECIPIENT_MODE:-DIRECT}
      OUTBOX_CAPTURE_ADDRESS: ${OUTBOX_CAPTURE_ADDRESS:-capture@production.invalid}
      OUTBOX_ALLOWED_RECIPIENTS: ${OUTBOX_ALLOWED_RECIPIENTS:-}
      OUTBOX_SENDER_ADDRESS: ${OUTBOX_SENDER_ADDRESS:-no-reply@topsdojob.com}
      OUTBOX_SENDER_NAME: ${OUTBOX_SENDER_NAME:-Tops do Job}
      OUTBOX_REPLY_TO: ${OUTBOX_REPLY_TO:-}
      OUTBOX_SMTP_HOST: ${OUTBOX_SMTP_HOST:?OUTBOX_SMTP_HOST obrigatorio}
      OUTBOX_SMTP_PORT: ${OUTBOX_SMTP_PORT:?OUTBOX_SMTP_PORT obrigatorio}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?SPRING_MAIL_USERNAME obrigatoria}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?SPRING_MAIL_PASSWORD obrigatoria}
      OUTBOX_SMTP_AUTH: ${OUTBOX_SMTP_AUTH:-true}
      OUTBOX_SMTP_STARTTLS: ${OUTBOX_SMTP_STARTTLS:-true}
      OUTBOX_SMTP_STARTTLS_REQUIRED: ${OUTBOX_SMTP_STARTTLS_REQUIRED:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:-false}
      EFI_ENABLED: ${EFI_ENABLED:-true}
      EFI_ENVIRONMENT: producao
      EFI_PIX_ENVIRONMENT: producao
      EFI_BASE_URL: https://pix.api.efipay.com.br
      EFI_PIX_BASE_URL: https://pix.api.efipay.com.br
      EFI_CLIENT_ID: ${EFI_CLIENT_ID:?EFI_CLIENT_ID obrigatorio}
      EFI_CLIENT_SECRET: ${EFI_CLIENT_SECRET:?EFI_CLIENT_SECRET obrigatorio}
      EFI_CERTIFICATE_PATH: ${EFI_CERTIFICATE_PATH:-/run/topsv3-efi/producao-892970-topsdojob.p12}
      EFI_CERTIFICATE_PROTECTION_VALUE: ${EFI_CERTIFICATE_PROTECTION_VALUE:-}
      EFI_PIX_CHAVE: ${EFI_PIX_CHAVE:?EFI_PIX_CHAVE obrigatoria}
      EFI_WEBHOOK_BASE_URL: ${EFI_WEBHOOK_BASE_URL:?EFI_WEBHOOK_BASE_URL obrigatoria}
      EFI_WEBHOOK_VERIFIER_VALUE: ${EFI_WEBHOOK_VERIFIER_VALUE:?EFI_WEBHOOK_VERIFIER_VALUE obrigatorio}
      EFI_WEBHOOK_REGISTRATION_ENABLED: ${EFI_WEBHOOK_REGISTRATION_ENABLED:-false}
      EFI_WEBHOOK_SKIP_MTLS_CHECKING: "false"
      EFI_CHARGE_EXPIRATION_SECONDS: ${EFI_CHARGE_EXPIRATION_SECONDS:-3600}
      EFI_RECONCILIATION_ENABLED: ${EFI_RECONCILIATION_ENABLED:-true}
      EFI_RECONCILIATION_INTERVAL_MS: ${EFI_RECONCILIATION_INTERVAL_MS:-60000}
      EFI_RECONCILIATION_BATCH_SIZE: ${EFI_RECONCILIATION_BATCH_SIZE:-25}
      EFI_RECONCILIATION_MAX_PER_CYCLE: ${EFI_RECONCILIATION_MAX_PER_CYCLE:-100}
      EFI_RECONCILIATION_RETRY_BACKOFF_SECONDS: ${EFI_RECONCILIATION_RETRY_BACKOFF_SECONDS:-300}
      R2_ENABLED: "true"
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT obrigatorio}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?R2_ACCESS_KEY obrigatoria}
      R2_SIGNING_VALUE: ${R2_SIGNING_VALUE:?R2_SIGNING_VALUE obrigatorio}
      R2_PUBLIC_MEDIA_BUCKET: ${R2_PUBLIC_MEDIA_BUCKET:?R2_PUBLIC_MEDIA_BUCKET obrigatorio}
      R2_PRIVATE_MEDIA_BUCKET: ${R2_PRIVATE_MEDIA_BUCKET:?R2_PRIVATE_MEDIA_BUCKET obrigatorio}
      R2_DOCUMENT_BUCKET: ${R2_DOCUMENT_BUCKET:?R2_DOCUMENT_BUCKET obrigatorio}
      R2_PUBLIC_MEDIA_PREFIX: ${R2_PUBLIC_MEDIA_PREFIX:?R2_PUBLIC_MEDIA_PREFIX obrigatorio}
      R2_PRIVATE_MEDIA_PREFIX: ${R2_PRIVATE_MEDIA_PREFIX:?R2_PRIVATE_MEDIA_PREFIX obrigatorio}
      R2_DOCUMENT_PREFIX: ${R2_DOCUMENT_PREFIX:?R2_DOCUMENT_PREFIX obrigatorio}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL obrigatoria}
      R2_PRESERVED_PUBLIC_MEDIA_BUCKET: ${R2_PRESERVED_PUBLIC_MEDIA_BUCKET:?R2_PRESERVED_PUBLIC_MEDIA_BUCKET obrigatorio}
      R2_PRESERVED_PUBLIC_MEDIA_PREFIX: ${R2_PRESERVED_PUBLIC_MEDIA_PREFIX:?R2_PRESERVED_PUBLIC_MEDIA_PREFIX obrigatorio}
      R2_PRESERVED_PUBLIC_BASE_URL: ${R2_PRESERVED_PUBLIC_BASE_URL:?R2_PRESERVED_PUBLIC_BASE_URL obrigatoria}
      R2_SIGNED_URL_TTL_SECONDS: ${R2_SIGNED_URL_TTL_SECONDS:-300}
    volumes:
      - /opt/topsv3/secrets/application-production.yml:/run/topsv3-config/application-production.yml:ro
      - /opt/topsv3/secrets/efi:/run/topsv3-efi:ro
    ports:
      - "127.0.0.1:28080:8080"
    networks:
      - topsv3-production-net

  frontend:
    image: topsv3-production-frontend:${TOPSV3_RELEASE_SHA:?TOPSV3_RELEASE_SHA obrigatorio}
    container_name: topsv3-production-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://topsdojob.com
        NEXT_PUBLIC_API_URL: https://topsdojob.com/api/public
        PUBLIC_API_TIMEOUT_MS: "${PUBLIC_API_TIMEOUT_MS:-5000}"
        NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
        NEXT_PUBLIC_FORCE_HTTPS: "true"
        NEXT_PUBLIC_EFI_PIX_ENABLED: ${EFI_ENABLED:-true}
        SEARCH_INDEXING_MODE: public
        R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL obrigatoria}
      dockerfile_inline: |
        FROM node:22.13.1-alpine AS deps
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        FROM node:22.13.1-alpine AS build
        WORKDIR /app
        ENV NEXT_TELEMETRY_DISABLED=1
        ARG NEXT_PUBLIC_SITE_URL
        ARG NEXT_PUBLIC_API_URL
        ARG PUBLIC_API_TIMEOUT_MS
        ARG NEXT_PUBLIC_ANALYTICS_ENABLED
        ARG NEXT_PUBLIC_FORCE_HTTPS
        ARG NEXT_PUBLIC_EFI_PIX_ENABLED
        ARG SEARCH_INDEXING_MODE
        ARG R2_PUBLIC_BASE_URL
        ENV NEXT_PUBLIC_SITE_URL=$${NEXT_PUBLIC_SITE_URL}
        ENV NEXT_PUBLIC_API_URL=$${NEXT_PUBLIC_API_URL}
        ENV PUBLIC_API_TIMEOUT_MS=$${PUBLIC_API_TIMEOUT_MS}
        ENV NEXT_PUBLIC_ANALYTICS_ENABLED=$${NEXT_PUBLIC_ANALYTICS_ENABLED}
        ENV NEXT_PUBLIC_FORCE_HTTPS=$${NEXT_PUBLIC_FORCE_HTTPS}
        ENV NEXT_PUBLIC_EFI_PIX_ENABLED=$${NEXT_PUBLIC_EFI_PIX_ENABLED}
        ENV SEARCH_INDEXING_MODE=$${SEARCH_INDEXING_MODE}
        ENV R2_PUBLIC_BASE_URL=$${R2_PUBLIC_BASE_URL}
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN npm run build
        FROM node:22.13.1-alpine AS runtime
        WORKDIR /app
        ENV NODE_ENV=production
        ENV NEXT_TELEMETRY_DISABLED=1
        ENV PORT=3000
        ENV HOSTNAME=0.0.0.0
        ENV NEXT_PUBLIC_SITE_URL=https://topsdojob.com
        ENV NEXT_PUBLIC_API_URL=https://topsdojob.com/api/public
        ENV INTERNAL_API_URL=http://backend:8080/api/public
        ENV PUBLIC_API_TIMEOUT_MS=5000
        ENV NEXT_PUBLIC_ANALYTICS_ENABLED=true
        ENV NEXT_PUBLIC_FORCE_HTTPS=true
        ENV NEXT_PUBLIC_EFI_PIX_ENABLED=true
        ENV SEARCH_INDEXING_MODE=public
        RUN rm -rf /usr/local/lib/node_modules/npm \
            && rm -f /usr/local/bin/npm /usr/local/bin/npx
        COPY --from=build --chown=node:node /app/public ./public
        COPY --from=build --chown=node:node /app/.next/standalone ./
        COPY --from=build --chown=node:node /app/.next/static ./.next/static
        RUN rm -rf node_modules/typescript \
            && mkdir -p .next/cache \
            && chown -R node:node .next
        USER node
        EXPOSE 3000
        CMD ["node", "server.js"]
    environment:
      NEXT_PUBLIC_SITE_URL: https://topsdojob.com
      NEXT_PUBLIC_API_URL: https://topsdojob.com/api/public
      INTERNAL_API_URL: http://backend:8080/api/public
      PUBLIC_API_TIMEOUT_MS: "${PUBLIC_API_TIMEOUT_MS:-5000}"
      NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
      NEXT_PUBLIC_FORCE_HTTPS: "true"
      NEXT_PUBLIC_EFI_PIX_ENABLED: ${EFI_ENABLED:-true}
      SEARCH_INDEXING_MODE: public
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL obrigatoria}
      INDEXNOW_SITE_URL: https://topsdojob.com
      INDEXNOW_KEY: ${INDEXNOW_KEY:?INDEXNOW_KEY obrigatoria em production.env}
    networks:
      - topsv3-production-net

  gateway:
    image: nginx:1.27-alpine
    container_name: topsv3-production-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - /opt/topsv3/secrets/nginx-production-local.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/topsv3/secrets/efi-webhook-allowlist.conf:/etc/nginx/efi-webhook-allowlist.conf:ro
    ports:
      - "127.0.0.1:23000:23000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:23000/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - topsv3-production-net

networks:
  topsv3-production-net:
    name: topsv3-production-net

volumes:
  topsv3-production-postgres-data:
    name: topsv3-production-postgres-data

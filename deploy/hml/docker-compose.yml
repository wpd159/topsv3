name: topsv3-hml

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: topsv3-hml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TOPSV3_POSTGRES_DB:-topsv3_hml}
      POSTGRES_USER: ${TOPSV3_POSTGRES_USER:-topsv3_hml}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/hml.env}
    volumes:
      - topsv3-hml-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - topsv3-hml-net

  flyway:
    image: flyway/flyway:12.10.0-alpine
    container_name: topsv3-hml-flyway
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${TOPSV3_POSTGRES_DB:-topsv3_hml}
      FLYWAY_USER: ${TOPSV3_POSTGRES_USER:-topsv3_hml}
      FLYWAY_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/hml.env}
      FLYWAY_CONNECT_RETRIES: "60"
    command: ["migrate"]
    volumes:
      - ../../backend/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - topsv3-hml-net

  backend:
    container_name: topsv3-hml-backend
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
    build:
      context: ../../backend
      dockerfile_inline: |
        FROM maven:3.9.9-eclipse-temurin-17 AS build
        WORKDIR /workspace
        COPY pom.xml .
        RUN mvn -q -DskipTests dependency:go-offline
        COPY src ./src
        RUN mvn -q -DskipTests package
        FROM eclipse-temurin:17.0.13_11-jre
        WORKDIR /app
        COPY --from=build /workspace/target/*.jar /app/app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: homologacao
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${TOPSV3_POSTGRES_DB:-topsv3_hml}
      SPRING_DATASOURCE_USERNAME: ${TOPSV3_POSTGRES_USER:-topsv3_hml}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/hml.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/hml.env}
      TOPSV3_BACKEND_PORT: 8080
      APP_ENV: homologacao
      APP_CANONICAL_DOMAIN: https://${HML_DOMAIN:-v3.esle.cloud}
      APP_CORS_ALLOWED_ORIGINS: https://${HML_DOMAIN:-v3.esle.cloud}
      APP_ADMIN_SESSION_COOKIE_SECURE: "true"
      APP_EVENT_HASH_SALT: ${APP_EVENT_HASH_SALT:?defina APP_EVENT_HASH_SALT em /opt/topsv3/secrets/hml.env}
      APP_AGE_GATE_SIGNING_VALUE: ${APP_AGE_GATE_SIGNING_VALUE:?defina APP_AGE_GATE_SIGNING_VALUE em /opt/topsv3/secrets/hml.env}
      EFI_PIX_MOCK_MODE: "true"
      R2_ENABLED: ${R2_ENABLED:?defina R2_ENABLED em /opt/topsv3/secrets/hml.env}
      R2_ENDPOINT: ${R2_ENDPOINT:?defina R2_ENDPOINT em /opt/topsv3/secrets/hml.env}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?defina R2_ACCESS_KEY em /opt/topsv3/secrets/hml.env}
      R2_SIGNING_VALUE: ${R2_SIGNING_VALUE:?defina R2_SIGNING_VALUE em /opt/topsv3/secrets/hml.env}
      R2_PUBLIC_MEDIA_BUCKET: ${R2_PUBLIC_MEDIA_BUCKET:?defina R2_PUBLIC_MEDIA_BUCKET em /opt/topsv3/secrets/hml.env}
      R2_PRIVATE_MEDIA_BUCKET: ${R2_PRIVATE_MEDIA_BUCKET:?defina R2_PRIVATE_MEDIA_BUCKET em /opt/topsv3/secrets/hml.env}
      R2_DOCUMENT_BUCKET: ${R2_DOCUMENT_BUCKET:?defina R2_DOCUMENT_BUCKET em /opt/topsv3/secrets/hml.env}
      R2_PUBLIC_MEDIA_PREFIX: ${R2_PUBLIC_MEDIA_PREFIX:-hml/midias-aprovadas/}
      R2_PRIVATE_MEDIA_PREFIX: ${R2_PRIVATE_MEDIA_PREFIX:-hml/midias-pendentes/}
      R2_DOCUMENT_PREFIX: ${R2_DOCUMENT_PREFIX:-hml/documentos/}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_SIGNED_URL_TTL_SECONDS: ${R2_SIGNED_URL_TTL_SECONDS:-300}
      UPLOAD_MAX_DOCUMENT_BYTES: ${UPLOAD_MAX_DOCUMENT_BYTES:-12582912}
    ports:
      - "127.0.0.1:${HML_BACKEND_PORT:-18080}:8080"
    networks:
      - topsv3-hml-net

  frontend:
    container_name: topsv3-hml-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    build:
      context: ../../frontend
      args:
        # Reset do frontend V3 (copia fiel do clone real, sem renomear env vars
        # no codigo copiado): o clone usa NEXT_PUBLIC_SITE_URL/NEXT_PUBLIC_API_URL
        # nativamente em todo o src/. NEXT_PUBLIC_API_URL ja inclui o prefixo
        # /api/public porque o codigo do clone chama caminhos sem prefixo
        # (ex.: `${API}/anuncios`) e o contrato real da V3 vive sob /api/public.
        # Endpoints do clone sem equivalente em /api/public (auth, kyc,
        # localidades, site-content, etc.) continuam retornando 404 e degradam
        # graciosamente (o proprio codigo do clone trata isso) - ver pendencias
        # no SDD.
        NEXT_PUBLIC_SITE_URL: https://${HML_DOMAIN:-v3.esle.cloud}
        NEXT_PUBLIC_API_URL: https://${HML_DOMAIN:-v3.esle.cloud}/api/public
      dockerfile_inline: |
        FROM node:22.13.1-alpine AS deps
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        FROM node:22.13.1-alpine AS build
        WORKDIR /app
        ARG NEXT_PUBLIC_SITE_URL
        ARG NEXT_PUBLIC_API_URL
        ENV NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
        ENV NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN npm run build
        FROM node:22.13.1-alpine AS runtime
        WORKDIR /app
        ENV NODE_ENV=production
        ENV NEXT_TELEMETRY_DISABLED=1
        COPY --from=build /app/package.json ./package.json
        COPY --from=build /app/package-lock.json ./package-lock.json
        COPY --from=build /app/node_modules ./node_modules
        COPY --from=build /app/.next ./.next
        COPY --from=build /app/public ./public
        EXPOSE 3000
        CMD ["npm", "run", "start", "--", "-p", "3000", "-H", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_SITE_URL: https://${HML_DOMAIN:-v3.esle.cloud}
      NEXT_PUBLIC_API_URL: https://${HML_DOMAIN:-v3.esle.cloud}/api/public
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${HML_FRONTEND_PORT:-13000}:3000"
    networks:
      - topsv3-hml-net

networks:
  topsv3-hml-net:
    name: topsv3-hml-net

volumes:
  topsv3-hml-postgres-data:
    name: topsv3-hml-postgres-data

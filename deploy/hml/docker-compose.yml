name: topsv3-hml

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: topsv3-hml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TOPSV3_POSTGRES_DB:-topsv3_hml}
      POSTGRES_USER: ${TOPSV3_POSTGRES_USER:-topsv3_hml}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/hml.env}
    volumes:
      - topsv3-hml-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - topsv3-hml-net

  flyway:
    image: flyway/flyway:12.10.0-alpine
    container_name: topsv3-hml-flyway
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${TOPSV3_POSTGRES_DB:-topsv3_hml}
      FLYWAY_USER: ${TOPSV3_POSTGRES_USER:-topsv3_hml}
      FLYWAY_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/hml.env}
      FLYWAY_CONNECT_RETRIES: "60"
    command: ["migrate"]
    volumes:
      - ../../backend/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - topsv3-hml-net

  backend:
    container_name: topsv3-hml-backend
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
    build:
      context: ../../backend
      dockerfile_inline: |
        FROM maven:3.9.9-eclipse-temurin-17 AS build
        WORKDIR /workspace
        COPY pom.xml .
        RUN mvn -q -DskipTests dependency:go-offline
        COPY src ./src
        RUN mvn -q -DskipTests package
        FROM eclipse-temurin:17.0.13_11-jre
        WORKDIR /app
        COPY --from=build /workspace/target/*.jar /app/app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: homologacao
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${TOPSV3_POSTGRES_DB:-topsv3_hml}
      SPRING_DATASOURCE_USERNAME: ${TOPSV3_POSTGRES_USER:-topsv3_hml}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/hml.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD em /opt/topsv3/secrets/hml.env}
      TOPSV3_BACKEND_PORT: 8080
      APP_ENV: homologacao
      APP_CANONICAL_DOMAIN: https://${HML_DOMAIN:-v3.esle.cloud}
      APP_CORS_ALLOWED_ORIGINS: https://${HML_DOMAIN:-v3.esle.cloud}
      APP_ADMIN_SESSION_COOKIE_SECURE: "true"
      APP_EVENT_HASH_SALT: ${APP_EVENT_HASH_SALT:?defina APP_EVENT_HASH_SALT em /opt/topsv3/secrets/hml.env}
      APP_AGE_GATE_SIGNING_VALUE: ${APP_AGE_GATE_SIGNING_VALUE:?defina APP_AGE_GATE_SIGNING_VALUE em /opt/topsv3/secrets/hml.env}
      EFI_PIX_MOCK_MODE: "true"
    ports:
      - "127.0.0.1:${HML_BACKEND_PORT:-18080}:8080"
    networks:
      - topsv3-hml-net

  frontend:
    container_name: topsv3-hml-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_APP_ENV: homologacao
        NEXT_PUBLIC_CANONICAL_DOMAIN: https://${HML_DOMAIN:-v3.esle.cloud}
        NEXT_PUBLIC_API_BASE_URL: https://${HML_DOMAIN:-v3.esle.cloud}
      dockerfile_inline: |
        FROM node:22.13.1-alpine AS deps
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        FROM node:22.13.1-alpine AS build
        WORKDIR /app
        ARG NEXT_PUBLIC_APP_ENV
        ARG NEXT_PUBLIC_CANONICAL_DOMAIN
        ARG NEXT_PUBLIC_API_BASE_URL
        ENV NEXT_PUBLIC_APP_ENV=$NEXT_PUBLIC_APP_ENV
        ENV NEXT_PUBLIC_CANONICAL_DOMAIN=$NEXT_PUBLIC_CANONICAL_DOMAIN
        ENV NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN npm run build
        FROM node:22.13.1-alpine AS runtime
        WORKDIR /app
        ENV NODE_ENV=production
        ENV NEXT_TELEMETRY_DISABLED=1
        COPY --from=build /app/package.json ./package.json
        COPY --from=build /app/package-lock.json ./package-lock.json
        COPY --from=build /app/node_modules ./node_modules
        COPY --from=build /app/.next ./.next
        COPY --from=build /app/public ./public
        EXPOSE 3000
        CMD ["npm", "run", "start", "--", "-p", "3000", "-H", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_APP_ENV: homologacao
      NEXT_PUBLIC_CANONICAL_DOMAIN: https://${HML_DOMAIN:-v3.esle.cloud}
      NEXT_PUBLIC_API_BASE_URL: https://${HML_DOMAIN:-v3.esle.cloud}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${HML_FRONTEND_PORT:-13000}:3000"
    networks:
      - topsv3-hml-net

networks:
  topsv3-hml-net:
    name: topsv3-hml-net

volumes:
  topsv3-hml-postgres-data:
    name: topsv3-hml-postgres-data
